  details { margin-top: 12px; } summary { cursor: pointer; font: 11px var(--mono); color: var(--dim); }
  .vacio { color: var(--faint); font-style: italic; padding: 12px 4px; }

e…"],"cons":[],"chips":["🎲 biblioteca regular","Exposición"],"refs":["puesto"]},{"id":"e:leer-inventario","kind":"escena","label":"leer-inventario","sub":"leo el inventario","req":[{"k":"lugar","frag":"puesto"}],"pistas":["El inventario del Círculo dice siempre «recuperado», nunca «hecho». Y el fraile escribió y tachó, sobre el aro: «no sé si es el primero».El inventario del Círculo dice siempre «recuperado», nunca «hecho»: nadie del grupo sostiene haber fabricado nada."],"cons":[],"chips":["🎲 buscar_libros regular","Exposición"],"refs":["puesto"]},{"id":"e:mirar-aro","kind":"escena","label":"mirar-aro","sub":"it-aro-recuperado · mirar/examinar/usar","req":[],"pistas":["El aro lo trabajó una mano humana, copiando torpemente una forma que no entendía. No hay manera de saber de cuándo es, de quién, ni si es el primero o el número treinta de una fila de intentos."],"cons":[],"chips":["🎲 ocultismo hard","Exposición"],"refs":["it-aro-recuperado"]},{"id":"e:leer-la-piedra","kind":"escena","label":"leer-la-piedra","sub":"que es esta piedra","req":[{"k":"lugar","frag":"monolito"}],"pistas":["La piedra negra es muy anterior a todo lo que hay alrededor, y quien la puso eligió este punto exacto a costa de un trabajo enorme.","La piedra negra no es un altar: es una marca de límite. No tiene nada tallado ni dónde apoyar nada, está sobre otra piedra más vieja en el mismo punto, y el anillo de pasto enfermo ya estaba ahí antes que ella. Quien la puso avisaba dónde termina algo, sin de…"],"cons":[{"desc":"El Círculo Rojo entendió, en 1674, que la piedra negra no es un altar sino una marca de límite puesta por gente muy anterior, sin nombre y sin fecha.","scope":"world"}],"chips":["🎲 ocultismo hard","SAN −1","Exposición"],"refs":["monolito"]},{"id":"e:sacar-lasca","kind":"escena","label":"sacar-lasca","sub":"saco una lasca","req":[{"k":"lugar","frag":"monolito"}],"pistas":[],"cons":[],"chips":["🎲 pelea regular","SAN −1","Exposición"],"refs":["monolito"]},{"id":"e:tocar-agua","kind":"escena","label":"tocar-agua","sub":"tocar/usar · water","req":[],"pistas":["Las ondas que hace una mano en la laguna no se apagan: rebotan contra un borde que está a un palmo de la mano, en todas las direcciones a la vez. El agua tiene un límite que no coincide con su orilla."],"cons":[],"chips":["🎲 COR regular","Exposición","Estabilidad"],"refs":[]},{"id":"e:hacer-punzon","kind":"escena","label":"hacer-punzon","sub":"hago el punzon","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"e:grabar-primero","kind":"escena","label":"grabar-primero","sub":"grabo el circulo","req":[{"k":"lugar","frag":"piedra"}],"pistas":["El primer círculo grabado en la piedra del alto quedó con el pulso temblando en el tramo de abajo. Está grabado y no pintado, a propósito: la pintura se va con el agua."],"cons":[{"desc":"El Círculo Rojo grabó, en 1674, el primer círculo en la piedra del alto — hondo y no pintado, con el pulso temblando en el tramo de abajo.","scope":"world"}],"chips":["Exposición"],"refs":["piedra"]},{"id":"e:aprender-anotar","kind":"escena","label":"aprender-anotar","sub":"sigo los ocho renglones","req":[],"pistas":["Los ocho renglones de la instrucción son una manera de poner en el papel lo que no entra en el papel. Funciona, y quien la usa no recuerda haber decidido lo que escribió."],"cons":[],"chips":["SAN −1","Exposición","hechizo"],"refs":[]},{"id":"e:aprender-cerrar","kind":"escena","label":"aprender-cerrar","sub":"cerrarle el paso","req":[],"pistas":["El límite que marca la piedra se puede cerrar sobre algo que lo cruzó. El Círculo sacó un arma de un aviso, y funciona."],"cons":[],"chips":["🎲 ocultismo hard","SAN −3","Exposición","hechizo","Estabilidad"],"refs":[]},{"id":"e:enfrentar-al-que-volvio","kind":"escena","label":"enfrentar-al-que-volvio","sub":"lo enfrento","req":[{"k":"lugar","frag":"rancho"}],"pistas":[],"cons":[{"desc":"El Círculo le cerró el paso al peón que volvió mojado de la laguna, y hubo pelea de verdad.","scope":"campaign"}],"chips":["SAN −2","Exposición","combate"],"refs":["rancho"]},{"id":"e:fin-guardar","kind":"escena","label":"fin-guardar","sub":"lo devuelvo al agua","req":[],"pistas":[],"cons":[{"desc":"En 1674, el Círculo Rojo devolvió el aro recuperado al fondo de la laguna, en el mismo punto del que había salido.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-anotar","kind":"escena","label":"fin-anotar","sub":"dejo la costumbre escrita","req":[],"pistas":[],"cons":[{"desc":"En 1674, el Círculo Rojo dejó la costumbre por escrito: grabar el límite, anotar lo que no se puede anotar, y pasarlo a quien viniera después.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-corregir","kind":"escena","label":"fin-corregir","sub":"anoto lo del chico","req":[],"pistas":[],"cons":[{"desc":"En 1674, el Círculo Rojo dejó escrito el caso del recién nacido zurdo de los Quiroga y el procedimiento para corregirlo, convirtiendo una costumbre de familia en una obligación anotada.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-dispersar","kind":"escena","label":"fin-dispersar","sub":"disuelvo el circulo","req":[],"pistas":[],"cons":[{"desc":"En 1674, el Círculo Rojo se disolvió sin dejar la costumbre escrita ni la piedra marcada: tres años de trabajo quedaron en un arca de un hombre solo.","scope":"world"}],"chips":[],"refs":[]},{"id":"t:g-aro","kind":"tema","label":"Preguntarle a Gaspar qué piensa hacer con el aro","sub":"Don Gaspar de Loaces","req":[],"pistas":["Don Gaspar no quiere devolver el aro al agua: sostiene que entender algo exige tenerlo."],"cons":[],"chips":[],"refs":[],"npc":"npc-gaspar"},{"id":"t:g-probo","kind":"tema","label":"Preguntarle si ya se lo puso","sub":"Don Gaspar de Loaces","req":[{"k":"narrado","frag":"Guardarlo no es hacer nada"}],"pistas":["Don Gaspar se puso el aro una noche, solo, antes que nadie. Dice que no pasó nada, y desde entonces no duerme del lado de la ventana."],"cons":[],"chips":["🎲 psicologia hard","secreto","SAN"],"refs":[],"npc":"npc-gaspar"},{"id":"t:m-fondo","kind":"tema","label":"Preguntarle a Melchor qué vio abajo","sub":"Melchor","req":[],"pistas":["Melchor entró de noche y sin luna, y abajo del agua se veía todo, iluminado desde arriba. Arriba no había luz."],"cons":[],"chips":["🎲 persuasion regular · confianza ≥2","secreto","SAN"],"refs":[],"npc":"npc-melchor"},{"id":"t:m-peon","kind":"tema","label":"Preguntarle por el que volvió mojado","sub":"Melchor","req":[],"pistas":["El peón entró a la laguna dos noches después de Melchor, justo después de que Melchor le contara lo que había visto abajo."],"cons":[],"chips":[],"refs":[],"npc":"npc-melchor"},{"id":"t:a-chico","kind":"tema","label":"Preguntarle a Ana por el chico","sub":"Ana Quiroga","req":[],"pistas":["Ana ya sabe que el chico es zurdo, y sabe que en el rancho todos lo vieron."],"cons":[],"chips":[],"refs":[],"npc":"npc-ana"},{"id":"t:a-correccion","kind":"tema","label":"Preguntarle qué van a hacer con la mano","sub":"Ana Quiroga","req":[{"k":"narrado","frag":"agarra con la izquierda"}],"pistas":["A Ana le corrigieron la mano a su hermano y nunca pasó nada: no sabe si eso prueba que sirvió o que nunca hizo falta. Teme que anotarlo lo vuelva obligatorio para siempre."],"cons":[],"chips":["🎲 psicologia regular · confianza ≥3","secreto","SAN"],"refs":[],"npc":"npc-ana"},{"id":"t:a-peon","kind":"tema","label":"Preguntarle por el que volvió mojado","sub":"Ana Quiroga","req":[],"pistas":["El que volvió camina hacia la laguna cada noche y cada vez hacen falta más hombres para traerlo. Se da vuelta si lo nombran."],"cons":[],"chips":[],"refs":[],"npc":"npc-ana"},{"id":"f:guardar","kind":"final","label":"Lo que se devuelve","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:anotar","kind":"final","label":"Lo que queda escrito","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:corregir","kind":"final","label":"Lo que se corrige","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]} eguntarle por qué pinta el marco","sub":"Ubaldo Leiva","req":[],"pistas":["Ubaldo Leiva pinta el marco cada septiembre desde hace cincuenta y un años. Heredó la tarea de su padre sin que nadie se la explicara ni se la pidiera: le empezó a llegar la plata y él ya sabía qué hacer."],"cons":[],"chips":[],"refs":[],"npc":"npc-ubaldo"},{"id":"t:u-plata","kind":"tema","label":"Preguntarle quién le paga","sub":"Ubaldo Leiva","req":[{"k":"pista","frag":"cincuenta y un años"}],"pistas":["A Ubaldo le llega la plata por giro postal sin remitente, dos veces al año, desde la cabecera. Nunca preguntó por miedo a que dejara de llegar."],"cons":[],"chips":["🎲 persuasion regular","secreto"],"refs":[],"npc":"npc-ubaldo"},{"id":"t:u-pasar","kind":"tema","label":"Preguntarle por qué no pasa por abajo del marco","sub":"Ubaldo Leiva","req":[{"k":"pista","frag":"cincuenta y un años"}],"pistas":["Ubaldo no cruza el vano y su padre tampoco cruzaba, sin que nadie se lo explicara. Un domador lo cruzó en 1920 o 1921, se quedó media hora callado, preguntó qué día era y se fue sin terminar el mate."],"cons":[],"chips":[],"refs":[],"npc":"npc-ubaldo"},{"id":"t:r-vuelta","kind":"tema","label":"Preguntarle por la vuelta pelada","sub":"Remigia Ithurbide","req":[],"pistas":["La vuelta pelada está desde antes de 1871. Tres generaciones de Ithurbide intentaron hacerla producir —arada, sembrada, abonada— y nunca creció nada, aunque la tierra es idéntica a la del resto del campo."],"cons":[],"chips":[],"refs":[],"npc":"npc-remigia"},{"id":"t:r-escritura","kind":"tema","label":"Pedirle ver la escritura del campo","sub":"Remigia Ithurbide","req":[{"k":"pista","frag":"desde antes de 1871"}],"pistas":["Remigia dejó sobre la mesa la carpeta con la escritura del campo y le dijo que la lea él: hay una parte que ella no entendió y nunca preguntó.","Remigia dejó sobre la mesa la carpeta con la escritura del campo, de mala gana y sin moverse de enfrente."],"cons":[],"chips":["🎲 credito regular"],"refs":[],"npc":"npc-remigia"},{"id":"t:r-alla","kind":"tema","label":"Preguntarle por el pueblo del oeste","sub":"Remigia Ithurbide","req":[{"k":"pista","frag":"desde antes de 1871"}],"pistas":["Remigia nunca conoció en setenta y cuatro años a nadie del pueblo del oeste, que está a tres leguas. Su madre viajaba treinta leguas a misa a Del Valle teniendo iglesia a tres, porque «allá la iglesia está, pero no es para nosotros»."],"cons":[],"chips":["🎲 psicologia hard · confianza ≥5","secreto","SAN"],"refs":[],"npc":"npc-remigia"},{"id":"f:seguir","kind":"final","label":"Lo que se camina","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:anotar","kind":"final","label":"Lo que queda anotado","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:quemar","kind":"final","label":"Lo que no se sigue","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:pintar","kind":"final","label":"Lo que se continúa","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]}],"locations":[{"id":"escuela","name":"La escuela de Villa Requena","start":true,"conn":["almacen"],"npcs":1,"npcIds":["npc-delfina"],"itemIds":["it-mapa"],"featIds":["f-mapa-pared","f-regla"],"desc":"Un aula de doce bancos con el techo de chapa y una estufa apagada, en marzo. Donde estaba el mapa de la provincia ahora hay un mapa del partido, más grande, clavado con cuatro chinches. Delfina Arce corrige cuadernos en el escritorio y no {lo} hace esperar."},{"id":"almacen","name":"El almacén de ramos generales","start":false,"conn":["escuela","puerta"],"npcs":1,"npcIds":["npc-adelmo"],"itemIds":[],"featIds":["f-libro-fiado"],"desc":"Mostrador de estaño, estantes hasta el techo y el olor de siempre. Es donde paran los que van de paso, y es de donde salieron los cinco rumores que Delfina anotó en tres años. Hay un sulky cargado de fierros atado en el palenque."},{"id":"puerta","name":"El campo del marco","start":false,"conn":["almacen","molino"],"npcs":1,"npcIds":["npc-ubaldo"],"itemIds":["it-tarro"],"featIds":["f-marco","f-cimientos"],"desc":"Ocho leguas al oeste. Un potrero grande sin una sola construcción en pie, y en el medio, parado solo, el marco de una puerta de ladrillo asentado sobre su propio umbral de piedra. No hay casa alrededor. No hay escombro. Sólo pasto y el marco, con las jambas pintadas de rojo hasta la altura de un hombre."},{"id":"molino","name":"La base sin molino","start":false,"conn":["puerta","pasto"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":["f-pernos","f-faja"],"desc":"Cinco leguas más al oeste. Una base de mampostería de dos metros de lado, con los cuatro pernos de anclaje parados y sin nada encima. El molino que iba ahí no está, y el tanque australiano de al lado está lleno hasta el borde. La base tiene una faja de almagre alrededor, a la altura del zócalo."},{"id":"pasto","name":"El campo de la vuelta pelada","start":false,"conn":["molino"],"npcs":1,"npcIds":["npc-remigia"],"itemIds":[],"featIds":["f-vuelta","f-arboleda"],"desc":"El punto más al oeste de los siete, y el más cercano a lo que Remigia Ithurbide llama «allá». En un potrero por lo demás normal hay una vuelta perfecta de tierra pelada, de unos cuarenta metros, donde no crece nada. Ni pasto, ni cardo, ni yuyo. El borde es limpio como el de un plato."}],"npcs":{"npc-delfina":"Delfina Arce","npc-ubaldo":"Ubaldo Leiva","npc-adelmo":"Adelmo Pais","npc-remigia":"Remigia Ithurbide"},"items":{"it-mapa":"El mapa de Delfina","it-tarro":"El tarro de Ubaldo","it-libreta":"La libreta de Adelmo"},"ocultas":[],"finales":[{"id":"seguir","title":"Lo que se camina","condition":"El investigador cruza la vuelta pelada y sigue para el oeste, hacia lo que Remigia no nombra."},{"id":"anotar","title":"Lo que queda anotado","condition":"El investigador vuelve, completa el mapa de Delfina y lo deja escrito, con lo que eso significa para quien lo lea después."},{"id":"quemar","title":"Lo que no se sigue","condition":"El investigador destruye el mapa para que nadie más camine la línea."},{"id":"pintar","title":"Lo que se continúa","condition":"El investigador pinta el punto siguiente, y con eso entra en la cuenta en lugar de mirarla desde afuera."}],"aristas":[{"de":"t:d-mapa-nuevo","a":"t:d-patron","por":"pista"},{"de":"t:d-patron","a":"t:d-quien-cuenta","por":"pista"},{"de":"t:a-oficio","a":"t:a-dos-puntos","por":"pista"},{"de":"t:a-dos-puntos","a":"t:a-bases-raras","por":"pista"},{"de":"t:u-pintar","a":"t:u-plata","por":"pista"},{"de":"t:u-pintar","a":"t:u-pasar","por":"pista"},{"de":"t:r-vuelta","a":"t:r-escritura","por":"pista"},{"de":"t:r-vuelta","a":"t:r-alla","por":"pista"}]},"agua-blanca":{"nodos":[{"id":"e:leer-cartel","kind":"escena","label":"leer-cartel","sub":"rasco","req":[{"k":"lugar","frag":"plaza"}],"pistas":["El pueblo se llamó Agua Blanca. El nombre está debajo de una mano de cal en el cartel de la entrada, tapado y no borrado."],"cons":[{"desc":"El investigador descubrió que Castronegro se llamó Agua Blanca, leyendo debajo de la cal del cartel de la entrada.","scope":"world"}],"chips":["Exposición"],"refs":["plaza"]},{"id":"e:leer-libreta","kind":"escena","label":"leer-libreta","sub":"leo la libreta","req":[],"pistas":["Ferrari contó los apellidos del padrón, los ordenó, y anotó debajo: «no es una familia, es un turno». Es la última línea que escribió antes de desaparecer."],"cons":[],"chips":["🎲 buscar_libros regular","Exposición","Estabilidad"],"refs":[]},{"id":"e:abrir-salita","kind":"escena","label":"abrir-salita","sub":"entro a la sala","req":[{"k":"lugar","frag":"biblioteca"}],"pistas":["La sala cerrada de la biblioteca guarda diez cajones de libros del siglo XVII y un registro de consultas con dos renglones en dieciocho años: Ferrari el 14 de julio y Prewitt el 16. Los dos desaparecieron esa misma semana."],"cons":[],"chips":["Exposición","Estabilidad"],"refs":["biblioteca"]},{"id":"e:granero-craneos","kind":"escena","label":"granero-craneos","sub":"grieta","req":[{"k":"lugar","frag":"granero"}],"pistas":["En una grieta del granero, acomodados y no tirados, hay tres cráneos recientes: uno con pelo, uno con un diente de oro de trabajo caro, y uno de alguien de menos de veinticinco años."],"cons":[],"chips":["🎲 descubrir regular","SAN −5","Exposición","Estabilidad"],"refs":["granero"]},{"id":"e:grieta-mas-alla","kind":"escena","label":"grieta-mas-alla","sub":"meto el brazo","req":[{"k":"lugar","frag":"granero"}],"pistas":[],"cons":[{"desc":"En el granero de Castronegro, el investigador le disparó a algo que salió de la grieta, en vez de dejarlo volver adentro.","scope":"world"},{"desc":"En el granero de Castronegro, el investigador se cruzó cuerpo a cuerpo con algo que salió de la grieta —encorvado, dientes largos, ojos verdes— y no se quedó a preguntar qué era.","scope":"world"}],"chips":["Exposición","combate"],"refs":["granero"]},{"id":"e:fechar-monolito","kind":"escena","label":"fechar-monolito","sub":"fecho el monolito","req":[{"k":"lugar","frag":"obelisco"}],"pistas":["El monolito está trabajado con herramienta de piedra —picado, no cortado— y desgastado por siglos de intemperie: es anterior a la fundación del pueblo y anterior a los pueblos que había antes. Está clavado a plomo."],"cons":[],"chips":["🎲 arqueologia regular","Exposición"],"refs":["obelisco"]},{"id":"e:fechar-estatuilla","kind":"escena","label":"fechar-estatuilla","sub":"la estatuilla","req":[{"k":"lleva","frag":"it-estatuilla"}],"pistas":["La estatuilla del granero está trabajada con herramienta de piedra, igual que el monolito, y está entera: no pasó siglos a la intemperie, pasó siglos guardada por alguien que sabía guardarla."],"cons":[],"chips":["🎲 arqueologia regular","Exposición"],"refs":["it-estatuilla"]},{"id":"e:mirar-lasca","kind":"escena","label":"mirar-lasca","sub":"la lasca","req":[{"k":"lleva","frag":"it-lasca"}],"pistas":["El monolito es de basalto, y el basalto más cercano está en Tandil, a ochenta leguas. Alguien trajo tres metros de piedra esa distancia, sin caminos ni ruedas, para clavarla en un campo llano."],"cons":[],"chips":["🎲 geologia regular","Exposición","Estabilidad"],"refs":["it-lasca"]},{"id":"e:ver-bautismos","kind":"escena","label":"ver-bautismos","sub":"la hoja del libro de bautismos","req":[{"k":"lugar","frag":"capilla"}],"pistas":["En ocho años la parroquia registró once bautismos y ciento nueve defunciones, sobre seiscientos habitantes. Del Valle, con la mitad de gente, bautiza veinte por año."],"cons":[],"chips":[],"refs":["capilla"]},{"id":"e:ver-recorte","kind":"escena","label":"ver-recorte","sub":"la carpeta de recortes","req":[{"k":"lugar","frag":"biblioteca"}],"pistas":[],"cons":[],"chips":["Exposición"],"refs":["biblioteca"]},{"id":"e:medir-vuelta","kind":"escena","label":"medir-vuelta","sub":"doy la vuelta","req":[{"k":"lugar","frag":"obelisco"}],"pistas":["El círculo de pasto enfermo alrededor del monolito mide ocho pasos de radio en cualquier dirección y cuarenta y cuatro de circunferencia, medido dos veces. Un círculo de ese radio tendría que medir cincuenta."],"cons":[],"chips":["Exposición","Estabilidad"],"refs":["obelisco"]},{"id":"e:fechar-talla","kind":"escena","label":"fechar-talla","sub":"la talla verde","req":[{"k":"lleva","frag":"it-talla-verde"}],"pistas":["La talla verde del bazar de Herminio está trabajada con la misma técnica que el monolito —piedra contra piedra, sin cincel—, y el reverso tiene una marca que no termina de leerse como dibujo."],"cons":[],"chips":["🎲 arqueologia regular","Exposición"],"refs":["it-talla-verde"]},{"id":"e:girar-talla","kind":"escena","label":"girar-talla","sub":"doy vuelta la talla","req":[{"k":"lleva","frag":"it-talla-verde"}],"pistas":["El reverso de la talla verde no es decorativo: es una instrucción de tallado que explica por qué el monolito está clavado exactamente donde está, no en otro punto del campo."],"cons":[],"chips":["🎲 COR regular","Mitos"],"refs":["it-talla-verde"]},{"id":"e:leer-cuaderno-tachado","kind":"escena","label":"leer-cuaderno-tachado","sub":"el cuaderno de cuentas","req":[{"k":"lleva","frag":"it-cuaderno-tachado"}],"pistas":["El cuaderno de cuentas del bazar de Herminio tiene, tachada, una columna de nombres de pila con fecha de nacimiento y sin fecha de defunción: el mismo tipo de registro que el libro de bautismos de la parroquia, llevado por alguien que no es el cura."],"cons":[],"chips":["🎲 buscar_libros hard","Exposición"],"refs":["it-cuaderno-tachado"]},{"id":"e:escuchar-cilindro","kind":"escena","label":"escuchar-cilindro","sub":"el cilindro de cera","req":[{"k":"lugar","frag":"tienda"}],"pistas":["El cilindro de cera del bazar de Herminio contiene un canto en una lengua irreconocible, cantado por algo que no respira como algo que canta debería respirar."],"cons":[],"chips":["SAN −1"],"refs":["tienda"]},{"id":"e:noche-posada","kind":"escena","label":"noche-posada","sub":"me acuesto a dormir","req":[{"k":"lugar","frag":"posada"}],"pistas":["El aljibe de la fonda quedó perfectamente quieto justo después de que algo cayera adentro, y de noche reflejó un cielo con más estrellas de las que había, y una figura que levantaba la mano del lado de adentro del reflejo. Del lado de afuera no había nadie."],"cons":[],"chips":["🎲 COR regular","Exposición"],"refs":["posada"]},{"id":"e:fin-subir","kind":"escena","label":"fin-subir","sub":"subo a la casa","req":[],"pistas":[],"cons":[{"desc":"El investigador subió a la casa de la loma de Castronegro por su propia voluntad, la misma noche que llegó al pueblo.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-llamar","kind":"escena","label":"fin-llamar","sub":"voy a la cabecera","req":[],"pistas":[],"cons":[{"desc":"El investigador fue a la cabecera a denunciar lo que vio en Castronegro, y no subió a la casa de la loma.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-escribir","kind":"escena","label":"fin-escribir","sub":"le escribo a delfina","req":[],"pistas":[],"cons":[{"desc":"El investigador le escribió a Delfina Arce todo lo que averiguó en Castronegro, para no ser el único que lo supiera, y no subió a la casa.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:fin-irse","kind":"escena","label":"fin-irse","sub":"me voy del pueblo","req":[],"pistas":[],"cons":[{"desc":"El investigador se fue de Castronegro sin subir a la casa y sin contarle a nadie lo que vio.","scope":"world"}],"chips":[],"refs":[]},{"id":"t:f-tres","kind":"tema","label":"Preguntarle por los tres que faltan","sub":"Faustino Otamendi","req":[],"pistas":["En julio desaparecieron tres: el profesor Ferrari, un americano llamado Prewitt que preguntaba lo mismo, y Onésimo Villeira-Pereira, del pueblo, de veintiún años. La policía archivó las tres como «se ausentó del domicilio»."],"cons":[],"chips":[],"refs":[],"npc":"npc-faustino"},{"id":"t:f-libreta","kind":"tema","label":"Preguntarle de quién es la libreta del estante","sub":"Faustino Otamendi","req":[{"k":"narrado","frag":"Ferrari"}],"pistas":[],"cons":[],"chips":["🎲 psicologia regular · confianza ≥3","secreto"],"refs":[],"npc":"npc-faustino"},{"id":"t:f-familias","kind":"tema","label":"Preguntarle por los Díaz y los Villeira-Pereira","sub":"Faustino Otamendi","req":[],"pistas":["Los Díaz y los Villeira-Pereira se casan entre ellos hace doscientos años y se reconocen a simple vista: los dientes, la postura, los ojos. Faustino, que vino de afuera hace veinte años, tarda «un segundo» en verlos como gente del pueblo."],"cons":[],"chips":["🎲 persuasion regular · confianza ≥2"],"refs":[],"npc":"npc-faustino"},{"id":"t:f-casa","kind":"tema","label":"Preguntarle quién vive en la casa de la loma","sub":"Faustino Otamendi","req":[],"pistas":["Faustino no habla de la casa de la loma, y cuando se le pregunta desde cuándo no habla de eso, no puede acordarse de haberlo decidido."],"cons":[],"chips":[],"refs":[],"npc":"npc-faustino"},{"id":"t:a-nadie","kind":"tema","label":"Preguntarle por qué su iglesia está vacía","sub":"el padre Anselmo","req":[],"pistas":["En Castronegro se bautizan en Del Valle, a treinta leguas, y no en la parroquia del pueblo. La explicación que dan es siempre la misma frase: «allá la iglesia está, pero no es para nosotros»."],"cons":[],"chips":[],"refs":[],"npc":"npc-anselmo"},{"id":"t:a-estatua","kind":"tema","label":"Preguntarle por la estatua del campanario","sub":"el padre Anselmo","req":[],"pistas":["La estatua del campanario la trajo el fundador y está atornillada al piso. El cura pidió dos veces sacarla y el obispado le contestó que se abstenga de innovar. En ocho años nunca subió de noche."],"cons":[],"chips":[],"refs":[],"npc":"npc-anselmo"},{"id":"t:a-bautismos","kind":"tema","label":"Preguntarle cuántos chicos bautizó","sub":"el padre Anselmo","req":[{"k":"narrado","frag":"no es para nosotros"}],"pistas":[],"cons":[],"chips":["🎲 psicologia regular · confianza ≥4","secreto","SAN"],"refs":[],"npc":"npc-anselmo"},{"id":"t:p-salita","kind":"tema","label":"Pedirle que abra la sala del fondo","sub":"Prudencio Herrera","req":[],"pistas":[],"cons":[],"chips":["🎲 persuasion hard"],"refs":[],"npc":"npc-prudencio"},{"id":"t:p-apellido","kind":"tema","label":"Preguntarle por su apellido","sub":"Prudencio Herrera","req":[],"pistas":["Los Herrera y los García llegaron en 1728 huyendo de la Inquisición y en el pueblo son una categoría propia, distinta de las dos familias fundadoras y distinta de los de afuera. Prudencio dice que «los del veintiocho» tienen obligaciones que nadie escribió."],"cons":[],"chips":[],"refs":[],"npc":"npc-prudencio"},{"id":"t:p-donante","kind":"tema","label":"Preguntarle quién donó los libros del fondo","sub":"Prudencio Herrera","req":[{"k":"narrado","frag":"engrasada"}],"pistas":[],"cons":[],"chips":["🎲 psicologia regular · confianza ≥2","secreto"],"refs":[],"npc":"npc-prudencio"},{"id":"t:s-ojos","kind":"tema","label":"Hablar con el muchacho de la plaza","sub":"Sixto Villeira-Pereira","req":[],"pistas":["Sixto Villeira-Pereira, diecinueve años, tiene los ojos de un verde que no se parece a ningún otro del pueblo, los pómulos altos, las muñecas finas y la espalda encorvada de alguien mucho mayor."],"cons":[],"chips":[],"refs":[],"npc":"npc-sixto"},{"id":"t:s-familia","kind":"tema","label":"Preguntarle por su familia","sub":"Sixto Villeira-Pereira","req":[{"k":"narrado","frag":"los ojos son verdes"}],"pistas":["Sixto sabe qué produce doscientos años de casamientos entre las mismas dos familias, y lo leyó él mismo. Lo que no sabe es por qué lo siguen haciendo."],"cons":[],"chips":[],"refs":[],"npc":"npc-sixto"},{"id":"t:s-hermano","kind":"tema","label":"Preguntarle por su hermano","sub":"Sixto Villeira-Pereira","req":[{"k":"narrado","frag":"por qué lo seguimos haciendo"},{"k":"pista","frag":"sube gente, y sube seguido"}],"pistas":["Onésimo Villeira-Pereira no desapareció: subió caminando a la casa de la loma con su madre, un martes de julio, «a que lo vieran» al cumplir veintiuno. La madre volvió. Él no. Sixto cumple veintiuno en marzo."],"cons":[],"chips":["🎲 psicologia hard · confianza ≥5","secreto","SAN"],"refs":[],"npc":"npc-sixto"},{"id":"t:s-casa","kind":"tema","label":"Preguntarle cómo se sube a la casa","sub":"Sixto Villeira-Pereira","req":[{"k":"narrado","frag":"A Onésimo lo subieron"}],"pistas":["A la casa de la loma se sube sin obstáculo: no hay tranquera ni perro, abren, hacen pasar y contestan. Según Sixto, lo que no se controla es cuándo se baja."],"cons":[],"chips":[],"refs":[],"npc":"npc-sixto"},{"id":"t:c-quien-es","kind":"tema","label":"Preguntarle al cabo quién es y qué hace ahí parado","sub":"Restituto Ledesma","req":[],"pistas":["El cabo Restituto Ledesma es la única autoridad que vive en el pueblo —la comisaría de verdad está en la cabecera— y desde que el investigador bajó del sulky no dejó de vigilarlo."],"cons":[],"chips":[],"refs":[],"npc":"npc-comisario"},{"id":"t:c-desaparecidos","kind":"tema","label":"Preguntarle al cabo por las tres desapariciones","sub":"Restituto Ledesma","req":[{"k":"narrado","frag":"no dejó de vigilarlo"}],"pistas":["El cabo Ledesma no sólo no investigó las tres desapariciones: le pide directamente al forastero que no lo haga, sin explicar por qué le importa a él."],"cons":[],"chips":[],"refs":[],"npc":"npc-comisario"},{"id":"t:c-amenaza","kind":"tema","label":"Decirle que va a seguir preguntando","sub":"Restituto Ledesma","req":[{"k":"pista","frag":"tres cráneos recientes"}],"pistas":[],"cons":[],"chips":[],"refs":[],"npc":"npc-comisario"},{"id":"t:c-plata","kind":"tema","label":"Preguntarle quién le paga","sub":"Restituto Ledesma","req":[{"k":"narrado","frag":"cómo podría arruinarle"}],"pistas":["El cabo Ledesma cobra cada tres meses un sobre de la administración de la casa de la loma a cambio de anotar en un cuaderno propio las novedades del pueblo."],"cons":[],"chips":["🎲 persuasion hard · confianza ≥-10","secreto"],"refs":[],"npc":"npc-comisario"},{"id":"t:e-aljibe","kind":"tema","label":"Preguntarle por el aljibe del patio","sub":"Encarnación Zambrano","req":[],"pistas":["Nadie en Castronegro toma agua del aljibe de la fonda desde hace treinta años, ni siquiera la dueña. Nadie decidió prohibirlo: dejaron de hacerlo todos, sin ponerse de acuerdo.","Encarnación corta cualquier pregunta sobre el aljibe apenas puede, y no cuenta nada que no le pregunten dos veces."],"cons":[],"chips":["🎲 persuasion regular","secreto"],"refs":[],"npc":"npc-encarnacion"},{"id":"t:h-negocio","kind":"tema","label":"Preguntarle cómo sobrevive un bazar así en un pueblo tan chico","sub":"Herminio Díaz","req":[],"pistas":["Herminio Díaz reenvía sin abrir la mitad de los cajones que recibe por correo a la casa de la loma. El bazar, según él mismo admite, no se sostiene con lo que vende en el mostrador."],"cons":[],"chips":["🎲 persuasion hard","secreto"],"refs":[],"npc":"npc-herminio"},{"id":"f:subir","kind":"final","label":"Lo que hay que subir","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:llamar","kind":"final","label":"Lo que se denuncia","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:escribir","kind":"final","label":"Lo que se le cuenta a otro","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:irse","kind":"final","label":"Lo que no se sigue","sub":"desenlace","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]}],"locations":[{"id":"plaza","name":"La plaza","start":true,"conn":["capilla","almacen","biblioteca","granero","posada","tienda"],"npcs":2,"npcIds":["npc-sixto","npc-comisario"],"itemIds":[],"featIds":["f-cartel","f-loma"],"desc":"Cuatro paraísos podados a lo bruto y un mástil sin bandera. Enfrente, la capilla. A la izquierda, el almacén de ramos generales. A la derecha, una casa baja con una chapa que dice BIBLIOTECA POPULAR. Y sobre la única loma del partido, a seis cuadras y arriba de todo, una casa de dos plantas con las persianas cerradas."},{"id":"capilla","name":"La capilla","start":false,"conn":["plaza"],"npcs":1,"npcIds":["npc-anselmo"],"itemIds":[],"featIds":["f-estatua","f-pernos"],"desc":"Una nave sola, ocho bancos, y un altar con un mantel limpio. Está impecable y está vacía, y las dos cosas juntas dan una impresión rara: es una iglesia cuidada por alguien que no tiene a quién abrirle la puerta. Al fondo, una escalera de madera sube al campanario."},{"id":"almacen","name":"El almacén de ramos generales","start":false,"conn":["plaza"],"npcs":1,"npcIds":["npc-faustino"],"itemIds":["it-libreta"],"featIds":["f-padron"],"desc":"Mostrador de estaño, estantes hasta el techo, y en la punta dos hombres que toman en silencio con el sombrero puesto. Faustino atiende. Arriba del estante de la yerba, entre una balanza rota y una caja de velas, hay una libreta de tapas negras que no es de nadie de acá."},{"id":"biblioteca","name":"La biblioteca popular","start":false,"conn":["plaza"],"npcs":1,"npcIds":["npc-prudencio"],"itemIds":[],"featIds":["f-fichero","f-puerta-salita"],"desc":"Dos ambientes. En el primero, cuatro estantes de novelas gastadas, u tibulo","comedor","despensa","trastero-sotano"],"npcs":0,"npcIds":[],"itemIds":["it-cuchillo-cocina"],"featIds":["f-puerta-cocina"],"desc":"Una cocina económica todavía tibia, ollas más grandes de lo que dos personas necesitan, y un cuchillo colgado de un gancho junto a la mesada."},{"id":"despensa","name":"La despensa","start":false,"conn":["cocina"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":["f-frascos-bajos"],"desc":"Estantes hasta el techo, casi todos con conservas caseras. En el estante más bajo, aparte de los demás, hay frascos que no tienen etiqueta de fruta ni de verdura."},{"id":"biblioteca","name":"La biblioteca","start":false,"conn":["vestibulo"],"npcs":0,"npcIds":[],"itemIds":["it-diario-bernardo"],"featIds":[],"desc":"Del piso al techo, en tres idiomas que reconocés y dos que no. Un atril en el centro sostiene un solo cuaderno, abierto, como si alguien lo estuviera esperando a uno solo de los que entran."},{"id":"pasillo-alto","name":"El pasillo del primer piso","start":false,"conn":["vestibulo","habitaciones-huespedes","dormitorio-bernardo"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Tres puertas de un lado, una del otro. La alfombra amortigua los pasos, cosa que en esta casa no tranquiliza a nadie."},{"id":"habitaciones-huespedes","name":"Las habitaciones de huéspedes","start":false,"conn":["pasillo-alto"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":["f-vaso-agua"],"desc":"Dos camas hechas, con las sábanas estiradas al milímetro, en dos cuartos que dan al mismo pasillo. Ninguna tiene una valija, un abrigo colgado, nada que diga que alguien las usa."},{"id":"dormitorio-bernardo","name":"El dormitorio principal","start":false,"conn":["pasillo-alto"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":["f-ropero-candado"],"desc":"Una cama que no se deshizo en años, un ropero cerrado, y una ventana con las cortinas cosidas al marco, no corridas: cosidas."},{"id":"trastero-sotano","name":"El trastero del sótano","start":false,"conn":["entrada-laberinto"],"npcs":1,"npcIds":["npc-guardian-sotano"],"itemIds":[],"featIds":[],"desc":"El aire cambia apenas se pisa el primer escalón: más frío, más quieto. Un trastero angosto, cajones apilados, y una sola puerta al fondo, sin picaporte de este lado."},{"id":"entrada-laberinto","name":"La entrada al laberinto","start":false,"conn":["laboratorio"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Un túnel de tierra apuntalada con vigas viejas, que baja apenas y se pierde en una curva a quince metros. No hace falta caminar los quince metros para saber que sigue mucho más allá."},{"id":"laboratorio","name":"El laboratorio","start":false,"conn":["laberinto-mas-alla"],"npcs":2,"npcIds":["npc-bernardo","npc-ahijado"],"itemIds":["it-bisturi-laboratorio"],"featIds":[],"desc":"Mesas de piedra, instrumentos que no son de ninguna farmacia ni de ningún hospital, y al fondo, sentado en un sillón que no combina con nada de lo demás, Bernardo Díaz. El Ahijado duerme, o hace como que duerme, enroscado en el brazo del sillón."},{"id":"el-mausoleo-puerta","name":"El mausoleo de los Díaz","start":false,"conn":["vestibulo","el-mausoleo-camara"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Una puerta de piedra encajada en la ladera de la loma, doscientos metros detrás de la casa, con un candado grande y viejo pasado entre dos argollas. El pasto de alrededor no crece parejo: hay un cerco irregular de tierra pelada, como si nada quisiera echar raíz ahí."},{"id":"el-mausoleo-camara","name":"La cámara del mausoleo","start":false,"conn":["el-mausoleo-puerta"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Una sola cámara excavada en la roca, con veinte nichos alrededor de las paredes: diecinueve sellados con una placa de bronce cada uno, y uno —el más cercano a la puerta— abierto y vacío."},{"id":"laberinto-mas-alla","name":"El pasadizo","start":false,"conn":["laboratorio","laberinto-ala-este","laberinto-ala-oeste"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"El laberinto sigue del otro lado del sillón de Bernardo, más ancho de lo que un sótano debería permitir. Dos pasajes se abren, uno a cada lado, y de los dos viene el mismo silencio raro: no el de un lugar vacío, el de un lugar que dejó de tener quien lo dirija."},{"id":"laberinto-ala-este","name":"El ala este","start":false,"conn":["laberinto-mas-alla"],"npcs":1,"npcIds":["npc-pariente-abelardo"],"itemIds":[],"featIds":[],"desc":"El pasaje de la derecha baja apenas y se ensancha en una especie de cuarto sin forma clara, con paja vieja amontonada contra una de las paredes."},{"id":"laberinto-ala-oeste","name":"El ala oeste","start":false,"conn":["laberinto-mas-alla"],"npcs":1,"npcIds":["npc-pariente-felisa"],"itemIds":[],"featIds":[],"desc":"El pasaje de la izquierda termina en un cuarto más chico, con marcas de uñas —muchas, superpuestas, de distintos tamaños— bajando por una de las paredes de tierra."}],"npcs":{"npc-ercilia":"Ercilia","npc-guardian-sotano":"El que quedó en la puerta","npc-ahijado":"Ahijado","npc-pariente-abelardo":"Abelardo Díaz","npc-pariente-felisa":"Felisa Díaz","npc-bernardo":"Bernardo Díaz"},"items":{"it-cuchillo-cocina":"Cuchillo de cocina","it-bisturi-laboratorio":"Instrumental de piedra","it-figura-abelardo":"Figurita de piedra","it-alfiler-felisa":"Alfiler de plata deslustrada","it-anillo-rubi":"Anillo de rubí","it-diario-bernardo":"Cuaderno de Bernardo","it-punzon-circulo":"El punzón del Círculo"},"ocultas":[{"desde":"cocina","hasta":"trastero-sotano","cond":"escalera de piedra que baja"},{"desde":"el-mausoleo-puerta","hasta":"el-mausoleo-camara","cond":"El candado del mausoleo cede"},{"desde":"laboratorio","hasta":"laberinto-mas-alla","cond":"el laberinto sigue por ahí"}],"finales":[{"id":"cortar","title":"El vigésimo, vacío","condition":"El investigador le saca el anillo a Bernardo y corta el ciclo, sin saber si hacía falta que siguiera."},{"id":"heredar","title":"El vigésimo, ocupado","condition":"El investigador se pone el anillo de Bernardo y la cuenta sigue, con otra mano."},{"id":"denunciar","title":"Lo que se saca de la casa","condition":"El investigador escapa de la Casa con lo que averiguó, para llevarlo a un juzgado."},{"id":"irse-vigesimo","title":"La quinta vez","condition":"El investigador sale de la Casa sin enfrentar a Bernardo hasta el final."}],"aristas":[]},"lo-que-bernardo-sabia":{"nodos":[{"id":"e:revelacion-ahijado","kind":"escena","label":"revelacion-ahijado","sub":"reviso lo que bernardo dejo","req":[{"k":"consecuencia","frag":"quedó vinculado a él"}],"pistas":[],"cons":[{"desc":"El investigador volvió a la Casa de Díaz y dejó que el Ahijado le enseñara a lanzar el primero de sus hechizos.","scope":"world"}],"chips":["SAN −3","hechizo"],"refs":[]},{"id":"e:revelacion-libro","kind":"escena","label":"revelacion-libro","sub":"reviso lo que bernardo dejo","req":[{"k":"consecuencia","frag":"cortando el ciclo sin saber si hacía falta"}],"pistas":["El libro sin título de Bernardo no es un texto original: cita, con letra más vieja que el resto, un nombre que no es el suyo y un lugar que no es Castronegro. Bernardo aprendió esto de alguien, en algún lado, y ese alguien tuvo que aprenderlo de otro más."],"cons":[{"desc":"El investigador volvió a la Casa de Díaz y leyó de punta a punta el libro sin título que Bernardo dejó en su laboratorio.","scope":"world"}],"chips":["SAN −2","Mitos","hechizo"],"refs":[]},{"id":"e:revelacion-nada","kind":"escena","label":"revelacion-nada","sub":"reviso lo que bernardo dejo","req":[],"pistas":[],"cons":[{"desc":"El investigador volvió a la Casa de Díaz y no encontró nada que Bernardo hubiera dejado para él.","scope":"world"}],"chips":[],"refs":[]},{"id":"e:revelacion-segundo","kind":"escena","label":"revelacion-segundo","sub":"aprendo el segundo hechizo","req":[],"pistas":[],"cons":[],"chips":["SAN −2","hechizo"],"refs":[]},{"id":"e:cerrar","kind":"escena","label":"cerrar","sub":"cierro este capitulo","req":[],"pistas":[],"cons":[],"chips":[],"refs":[]}, kind":"escena","label":"leer-papeles","sub":"leo los papeles","req":[{"k":"consecuencia","frag":"leyó de punta a punta el libro sin título"}],"pistas":["Los papeles del campamento son de dos manos anteriores a Bernardo: un inventario de cosas RECUPERADAS —nunca fabricadas— de una casa del sur, y una instrucción copiada de otra instrucción. Nadie anotó de quién eran las cosas ni quién escribió la primera hoja.","El nombre y el lugar que el libro sin título de Bernardo citaba con letra más vieja son los del inventario del baúl del campamento: la fuente de Bernardo no era un maestro, era este papel. Él también estaba copiando."],"cons":[{"desc":"El investigador identificó la fuente que el libro de Bernardo citaba sin nombrar: los papeles del grupo que trabajó entre 1650 y 1675, que Bernardo tenía en su campamento antes de fundar el pueblo.","scope":"world"}],"chips":["🎲 buscar_libros regular","Exposición","Mitos","hechizo"],"refs":[]},{"id":"e:mirar-circulos","kind":"escena","label":"mirar-circulos","sub":"miro los circulos","req":[],"pistas":["La base de la piedra tiene ocho círculos grabados uno encima del otro, hondos, no pintados. El pulso del primero tiembla; el del octavo no. Alguien viene repitiendo la marca, año tras año, siguiendo una instrucción que no entiende.La base de la piedra tiene c…"],"cons":[],"chips":["🎲 descubrir regular","Exposición","Estabilidad"],"refs":[]},{"id":"e:el-encuentro","kind":"escena","label":"el-encuentro","sub":"me quedo a ver que hace bernardo","req":[],"pistas":["Bernardo no fabricó el anillo: lo sacó del fondo de la laguna, once días después de que el agua le mostrara una mano tomando un anillo. Interpretó la imagen como una indicación dirigida a él. La imagen nunca dijo de quién era la mano.","Bernardo vio al investigador ANTES de mirar lo que había sacado del agua, y no lo leyó como una confirmación: lo leyó como un testigo que apareció el mismo día en que el agua le contestó."],"cons":[{"desc":"El investigador vio, en una visión de 1679, cómo Bernardo Díaz encontró el anillo en el fondo de la laguna — y Bernardo lo vio a él primero, antes de mirar lo que había sacado.El investigador vio, en una visión de 1679, cómo Bernardo Díaz encontró el anillo en el fondo de la laguna: no lo fabricó,…","scope":"world"}],"chips":["🎲 sigilo regular","Exposición","Estabilidad"],"refs":[]},{"id":"e:te-ve","kind":"escena","label":"te-ve","sub":"me quedo donde puede verme","req":[],"pistas":["En 1679 Bernardo levantó la vista del anillo recién sacado del agua y miró directamente al investigador, y alrededor de él, como si viera un grupo entero. No lo miró como a un intruso: lo miró como a una confirmación. No sabía su nombre."],"cons":[{"desc":"En una visión de 1679, Bernardo Díaz vio al investigador parado en su orilla y lo tomó como la confirmación de que lo que había leído en el agua era una promesa.","scope":"world"}],"chips":["🎲 COR regular","Exposición","Estabilidad"],"refs":[]},{"id":"e:mirar-carreta","kind":"escena","label":"mirar-carreta","sub":"miro la carreta","req":[],"pistas":["La carreta del campamento no tiene una sola pieza roscada: todo es espiga, cuña y tiento, y está nueva. Es de una época en la que la rosca de metal todavía se hacía a mano."],"cons":[],"chips":["🎲 descubrir regular","Exposición"],"refs":[]},{"id":"e:ubicarse","kind":"escena","label":"ubicarse","sub":"trato de ubicarme en el tiempo","req":[],"pistas":["La visión transcurre en noviembre de 1679: la carreta, la ropa, la letra y la manera de anotar los números caen todas en la misma década. Castronegro se funda al año siguiente.La visión transcurre en algún punto del siglo XVII: la carreta, la ropa y la letra…"],"cons":[],"chips":["Exposición"],"refs":[]},{"id":"e:tocar-agua","kind":"escena","label":"tocar-agua","sub":"meto la mano en el agua","req":[],"pistas":["Las ondas que hace la mano del investigador en la laguna no se apagan: rebotan contra un borde que está a un palmo de la mano, en todas las direcciones a la vez. E
