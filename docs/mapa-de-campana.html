":[],"npc":"npc-ignacio"},{"id":"t:i-castronegro","kind":"tema","label":"Preguntarle si conoce otro lugar como éste","sub":"Fray Ignacio de la Cruz","req":[],"pistas":["El manuscrito de 1674 menciona otro paraje, lejos, cerca del mar, donde el agua también «se porta mal» y hay quien la vigila sin saber por qué.","Fray Ignacio esquivó la pregunta de si hay otros lugares como éste, pero miró el legajo antes de decir que no sabe."],"cons":[],"chips":["🎲 persuasion regular · confianza ≥2"],"refs":[],"npc":"npc-ignacio"},{"id":"t:i-camino","kind":"tema","label":"Preguntarle cómo llegó ese legajo hasta San Juan","sub":"Fray Ignacio de la Cruz","req":[{"k":"pista","frag":"el último eslabón de ese grupo en San Juan"}],"pistas":["El manuscrito de 1674 tardó veinticuatro años en llegar a San Juan, pasando por al menos cuatro manos —un arriero que no sabía qué llevaba, un cura que sí, una mujer que lo trajo a pie desde Mendoza en 1698— y sin un solo registro escrito. El Círculo no es un…","Fray Ignacio no sabe —o no quiere decir— por qué manos pasó el legajo de 1674 antes de llegarle a él."],"cons":[],"chips":["🎲 historia regular · confianza ≥2"],"refs":[],"npc":"npc-ignacio"},{"id":"t:i-margen","kind":"tema","label":"Preguntarle por el agregado al margen del manuscrito","sub":"Fray Ignacio de la Cruz","req":[],"pistas":["Fray Ignacio admite haber agregado él mismo, hace ocho años, la línea que dice que «pintar alcanza» — convencido de estar corrigiendo un error del manuscrito original."],"cons":[],"chips":["🎲 persuasion hard · confianza ≥2","secreto"],"refs":[],"npc":"npc-ignacio"},{"id":"t:t-fosa","kind":"tema","label":"Preguntarle qué es la fosa","sub":"Takillpa","req":[],"pistas":["Takillpa dice que la ciénaga mantiene cerrado un borde entre este mundo y otro, y que desecarla lo va a abrir."],"cons":[],"chips":[],"refs":[],"npc":"npc-takillpa"},{"id":"t:t-cerrar","kind":"tema","label":"Preguntarle cómo se cierra un borde así","sub":"Takillpa","req":[],"pistas":["Takillpa conoce una manera de «cerrarle el paso» a lo que cruza un borde, aprendida de generaciones de guardianes anteriores a las acequias coloniales — sin papel ni fuego, con las manos.","Takillpa sabe cómo se cierra un borde, pero no se lo cuenta a cualquiera: dice que a los suyos ya los escucharon contar cosas una vez."],"cons":[],"chips":["🎲 persuasion regular · confianza ≥2"],"refs":[],"npc":"npc-takillpa"},{"id":"t:t-mita","kind":"tema","label":"Preguntarle por la mita","sub":"Takillpa","req":[],"pistas":["Takillpa sobrevivió dos levas de mita hacia Chile; la mayoría de los que se llevan no vuelve, y los guardianes huarpes de la ciénaga son cada vez menos."],"cons":[],"chips":[],"refs":[],"npc":"npc-takillpa"},{"id":"t:t-anteriores","kind":"tema","label":"Preguntarle quién cuidaba esto antes que él","sub":"Takillpa","req":[{"k":"pista","frag":"los guardianes huarpes de la ciénaga son cada vez menos"}],"pistas":["De los once guardianes huarpes que cuidaban la ciénaga cuando Takillpa aprendió, quedan cuatro, y dos ya no pueden subir al cerro. Al último lo encontraron muerto al lado de la fosa, sin una marca encima, cerrando algo que no llegó a cerrar."],"cons":[],"chips":["🎲 psicologia regular · confianza ≥3"],"refs":[],"npc":"npc-takillpa"},{"id":"t:j-hijo","kind":"tema","label":"Preguntarle por el hijo","sub":"Josefa Sosa","req":[],"pistas":["Josefa Sosa sabe que su hijo nació zurdo y que el Cabildo, instigado por Fray Ignacio, quiere corregirle la mano antes de que cumpla un año."],"cons":[],"chips":[],"refs":[],"npc":"npc-josefa"},{"id":"t:j-familia","kind":"tema","label":"Preguntarle por su familia","sub":"Josefa Sosa","req":[],"pistas":["La familia Sosa de Josefa está en el Valle de Zonda desde antes de lo que ella puede contar, y la zurdera del hijo «no es la primera vez que pasa en la familia»."],"cons":[],"chips":[],"refs":[],"npc":"npc-josefa"},{"id":"t:j-patron","kind":"tema","label":"Preguntarle si conoce a alguien más a quien le haya pasado esto","sub":"Josefa Sosa","req":[{"k":"pista","frag":"no es la primera vez que pasa en la familia"}],"pistas":["El rasgo de la sangre Sosa —lo que Fray Ignacio llama «corregir la mano»— no es una superstición local: es un patrón documentable, reconocible en más de una familia y más de una generación, demasiado consistente para ser casualidad.","El rasgo de sangre que preocupa a Josefa podría ser un patrón real repetido en otras familias, o podría ser sólo el miedo de una madre buscando no estar sola con eso — todavía no hay forma de saber cuál de las dos cosas es."],"cons":[],"chips":["🎲 antropologia regular · confianza ≥2"],"refs":[],"npc":"npc-josefa"},{"id":"t:j-corregidos","kind":"tema","label":"Preguntarle qué fue de los otros a los que corrigieron","sub":"Josefa Sosa","req":[{"k":"pista","frag":"no es la primera vez que pasa en la familia"}],"pistas":["Al hermano de la abuela de Josefa le corrigieron la mano de bebé y vivió cuarenta años sin dormir una noche entera: decía que soñaba con agua quieta y prefería no cerrar los ojos. Corregir la mano no arregla lo que sea que pase con esa sangre — sólo lo deja s…"],"cons":[],"chips":["🎲 psicologia regular · confianza ≥3","SAN"],"refs":[],"npc":"npc-josefa"},{"id":"t:g-orden","kind":"tema","label":"Preguntarle por la desecación","sub":"Don Gonzalo de Estrada","req":[],"pistas":[],"cons":[],"chips":[],"refs":[],"npc":"npc-gonzalo"},{"id":"t:g-miedo","kind":"tema","label":"Notar qué hay detrás de tanta insistencia","sub":"Don Gonzalo de Estrada","req":[],"pistas":["Don Gonzalo de Estrada no le teme a lo que hay en la ciénaga: le teme a que el Santo Oficio se entere de que él ya sospechaba algo y calló. Su urgencia es la de un hombre protegiéndose de una denuncia, no la de un administrador cumpliendo una orden."],"cons":[],"chips":["🎲 psicologia regular"],"refs":[],"npc":"npc-gonzalo"},{"id":"f:firmar-actas","kind":"final","label":"Lo que queda escrito","sub":"desenlace","req":[{"k":"otro","frag":"@e:firmar-actas"}],"pistas":[],"cons":[],"chips":[],"refs":[]},{"id":"f:fuga-final","kind":"final","label":"Lo que queda grabado","sub":"desenlace","req":[{"k":"otro","frag":"@e:fuga-final"}],"pistas":[],"cons":[],"chips":[],"refs":[]}],"locations":[{"id":"orilla-1710","name":"La orilla del cauce","start":true,"conn":["plaza-mayor"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Barro fresco, húmedo, de un río que corre de verdad. No hay campamento, no hay estación, no hay cartel torcido. El aire huele a agua y a algo verde que en 1930 no existe en ningún lado cerca de acá."},{"id":"plaza-mayor","name":"La Plaza Mayor","start":false,"conn":["orilla-1710","convento-merced","canaverales"],"npcs":1,"npcIds":["npc-josefa"],"itemIds":[],"featIds":[],"desc":"Casas de adobe bajas alrededor de una plaza de tierra apisonada. La iglesia matriz de un lado, el Cabildo del otro. Nadie viste como el investigador, y todos lo notan sin decir nada — todavía."},{"id":"canaverales","name":"Los cañaverales","start":false,"conn":["plaza-mayor","canaverales-fuga"],"npcs":1,"npcIds":["npc-takillpa"],"itemIds":[],"featIds":["f-reflejo-acequia"],"desc":"Una red de acequias prehispánicas, angostas, corriendo entre cañaverales altos. El agua acá todavía se mueve, pero apenas."},{"id":"convento-merced","name":"El Convento de la Merced","start":false,"conn":["plaza-mayor","celda-convento"],"npcs":1,"npcIds":["npc-ignacio"],"itemIds":["it-almagre-colonial"],"featIds":[],"desc":"Adobe grueso, vigas de algarrobo. Fray Ignacio recibe en el locutorio con una calma que no se explica sólo con la fe. Lo primero que hizo, antes de preguntar nada, fue mandar que le preparen un cuarto de huéspedes al fondo del claustro: a un forastero con esa ropa no se lo deja durmiendo en la plaza."},{"id":"celda-convento","name":"El cuarto de huéspedes","start":false,"conn":["scriptorium","canaverales-fuga"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"El cuarto que le prepararon al fondo del claustro: un catre, una mesa, una vela, y una ventana que da al patio de los naranjos. Es la tercera noche desde que llegó, y es la primera en que se acuesta sabiendo por qué está acá.\n\nEl viento Zonda sube, sofocante. Y entonces pasan dos cosas al mismo tiempo, y no hay tiempo para las dos.\n\nUn novicio desliza por debajo de la puerta una nota con sello de cera roja: Fray Ignacio convoca al scriptorium antes de la medianoche, con las actas de 1674 desplegadas.\n\nAl mismo tiempo, al acercarse a la ventana a airear el cuarto, hay una marca fresca de barro húmedo en el marco exterior — la misma línea cruzada por un semicírculo que se ve en la piedra del brocal, doscientos años más adelante— y, abajo, entre los naranjos del patio, una figura agazapada hace una seña hacia los cerros.\n\nNo hay forma de atender las dos cosas. Elegir una cierra la otra, esta noche y todas las que vengan."},{"id":"scriptorium","name":"El scriptorium","start":false,"conn":["obras-cofradia"],"npcs":1,"npcIds":["npc-ignacio"],"itemIds":["it-manuscrito-1674"],"featIds":[],"desc":"Estantes de cuero y papel, una mesa larga cubierta de legajos. Fray Ignacio espera con las actas de 1674 ya abiertas, como si llevara toda la noche esperando a que alguien más las leyera."},{"id":"obras-cofradia","name":"La desecación de la ciénaga","start":false,"conn":[],"npcs":1,"npcIds":["npc-polipo"],"itemIds":["it-mosquete-guardia"],"featIds":[],"desc":"Zanjas nuevas cortando la ciénaga en franjas, peones y esclavos trabajando bajo la mirada de dos soldados de la rastrillería. El agua ya bajó más de lo que bajó en cien años."},{"id":"canaverales-fuga","name":"El escondite entre las cañas","start":false,"conn":["cienaga-sabotaje"],"npcs":1,"npcIds":["npc-takillpa"],"itemIds":[],"featIds":[],"desc":"Takillpa espera agazapado entre las cañas altas, con el oído puesto en el camino y no en quien llega. En algún lado del pueblo, todavía lejos, los perros de la guardia empiezan a ladrar. No hay tiempo para explicaciones largas."},{"id":"cienaga-sabotaje","name":"La Ciénaga de las Ánimas","start":false,"conn":[],"npcs":2,"npcIds":["npc-gonzalo","npc-vagabundo"],"itemIds":[],"featIds":["f-piedra-caliza"],"desc":"El corazón del humedal, todavía intacto. Una piedra caliza asoma entre los juncos, con marcas que no son de picapedrero. A lo lejos, del otro lado del agua, una ronda de la rastrillería de Don Gonzalo pasa cada tanto con un farol."}],"npcs":{"npc-ignacio":"Fray Ignacio de la Cruz","npc-gonzalo":"Don Gonzalo de Estrada","npc-takillpa":"Takillpa","npc-josefa":"Josefa Sosa","npc-polipo":"Pólipo Septentrional","npc-vagabundo":"Vagabundo Dimensional"},"items":{"it-manuscrito-1674":"El manuscrito de Fray Ignacio","it-almagre-colonial":"Almagre molido","it-mosquete-guardia":"Mosquete de la guardia"},"ocultas":[{"desde":"convento-merced","hasta":"celda-convento","cond":"el último eslabón de ese grupo en San Juan, mantiene cerrado un borde entre este mundo y otro"},{"desde":"canaverales","hasta":"canaverales-fuga","cond":"conoce una manera de «cerrarle el paso»"}],"finales":[{"id":"firmar-actas","title":"Lo que queda escrito","condition":"El investigador colabora con Fray Ignacio y el Círculo Rojo temprano, sella el borde con almagre colonial y firma las actas del Cabildo como testigo — y descubre, cuando va a buscar la grieta, que cerrar el borde cerró también su camino de vuelta. Queda en 1710."},{"id":"fuga-final","title":"Lo que queda grabado","condition":"El investigador se alía con Takillpa y los guardianes huarpes y graba la marca en la piedra caliza — y descubre, parado al borde de la fosa que ya no respira, que cerrar el borde cerró también su camino de vuelta. Queda en 1710, prófugo."}],"aristas":[{"de":"e:combate-polipo","a":"e:pintar-circulo","por":"consecuencia"},{"de":"e:combate-vagabundo","a":"e:cerrarle-el-paso-ritual","por":"consecuencia"},{"de":"t:i-manuscrito","a":"t:i-camino","por":"pista"},{"de":"t:t-mita","a":"t:t-anteriores","por":"pista"},{"de":"t:j-familia","a":"t:j-patron","por":"pista"},{"de":"t:j-familia","a":"t:j-corregidos","por":"pista"},{"de":"e:firmar-actas","a":"f:firmar-actas","por":"desenlace"},{"de":"e:fuga-final","a":"f:fuga-final","por":"desenlace"}]}},"cruces":[{"de":"agua-quieta","a":"legua-perdida","frag":"Rosa Quintana no estaba a la mañana","scope":"world","desde":"e:fin-quedarse","hasta":"t:c-otro-lado"},{"de":"agua-quieta","a":"invierno-debido","frag":"del Círculo Rojo","scope":"world","desde":"e:leer-cuaderno","hasta":"t:a-como-sabe"},{"de":"legua-perdida","a":"invierno-debido","frag":"del Círculo Rojo","scope":"world","desde":"e:leer-mensuras","hasta":"t:a-como-sabe"},{"de":"tercer-umbral","a":"invierno-debido","frag":"del Círculo Rojo","scope":"world","desde":"e:buscar-partida","hasta":"t:a-como-sabe"},{"de":"invierno-debido","a":"sueno-debido","frag":"le fue encima a Cirilo Sosa","scope":"campaign","desde":"e:combate-cirilo","hasta":"t:r-1878-forzado"},{"de":"invierno-debido","a":"sueno-debido","frag":"sacó un arma de fuego y le disparó a Cirilo Sosa","scope":"campaign","desde":"e:combate-cirilo","hasta":"t:r-1878-forzado-disparo"},{"de":"agua-blanca","a":"el-vigesimo","frag":"por su propia voluntad, la misma noche","scope":"world","desde":"e:fin-subir","hasta":"t:e-puente-subir"},{"de":"agua-blanca","a":"el-vigesimo","frag":"fue a la cabecera a denunciar","scope":"world","desde":"e:fin-llamar","hasta":"t:e-puente-llamar"},{"de":"agua-blanca","a":"el-vigesimo","frag":"le escribió a Delfina Arce","scope":"world","desde":"e:fin-escribir","hasta":"t:e-puente-escribir"},{"de":"agua-blanca","a":"el-vigesimo","frag":"se fue de Castronegro sin subir","scope":"world","desde":"e:fin-irse","hasta":"t:e-puente-irse"},{"de":"el-vigesimo","a":"lo-que-bernardo-sabia","frag":"quedó vinculado a él","scope":"world","desde":"e:fin-heredar","hasta":"e:revelacion-ahijado"},{"de":"el-vigesimo","a":"lo-que-bernardo-sabia","frag":"cortando el ciclo sin saber si hacía falta","scope":"world","desde":"e:fin-cortar","hasta":"e:revelacion-libro"},{"de":"el-vigesimo","a":"el-hombre-que-miraba-el-agua","frag":"quedó vinculado a él","scope":"world","desde":"e:fin-heredar","hasta":"e:mirar-agua-anillo"},{"de":"el-vigesimo","a":"el-hombre-que-miraba-el-agua","frag":"cortando el ciclo sin saber si hacía falta","scope":"world","desde":"e:fin-cortar","hasta":"e:mirar-agua-sin-anillo"},{"de":"lo-que-bernardo-sabia","a":"el-hombre-que-miraba-el-agua","frag":"leyó de punta a punta el libro sin título","scope":"world","desde":"e:revelacion-libro","hasta":"e:leer-papeles"},{"de":"la-grieta-del-zonda","a":"la-merced-de-las-animas","frag":"Eusebio Sosa alcanzó a explicarle","scope":"campaign","desde":"e:pedir-que-ensene","hasta":"e:pintar-circulo"}],"enDiseno":{"id":"santo-oficio-de-cuyo","title":"El Santo Oficio de Cuyo","requiere":["la-merced-de-las-animas"],"epoca":"Noviembre de 1710 · 2-3 semanas","estado":"diseño aprobado, sin escribir","aperturas":[{"id":"firmar-actas","nombre":"Iglesia","detalle":"Amanecer en el zanjón con Fray Ignacio. Sospecha inicial 35."},{"id":"fuga-final","nombre":"Huarpe","detalle":"La misma noche, en el totoral, con la Rastrillería atrás."}],"actos":["Acto I · cada rama en su mundo","Acto II · cazado por las dos partes","Acto III · Hualilán"],"salidas":[{"id":"salida-1930","nombre":"1930 · liberación controlada","detalle":"Aflojar el sello a propósito: el agua se pierde de golpe."},{"id":"salida-1944","nombre":"1944 · dejarlo reventar","detalle":"Cruzar en el terremoto del 15 de enero. La más peligrosa."},{"id":"salida-quedarse","nombre":"Quedarse · reforzar el sello","detalle":"Con el ingrediente de Hualilán. El 1944 queda sin resolver."}],"esqueleto":{"_nota":"Esqueleto de «El Santo Oficio de Cuyo». Es DISEÑO, no contenido jugable: lo lee sólo src/mapa-campana.ts para dibujarlo. Cuando se escriba la aventura real, este archivo se borra. Nombres: los apellidos salen de fuentes sobre Cuyo colonial; los nombres de pila son inventados para no tocar a ninguna persona real (ver `fuente` en cada NPC). La Labor Vieja es FICTICIA: Hualilán fue estancia ganadera hasta 1751. Se toma de la Precordillera sanjuanina, de calizas ordovícicas reales.","startLocation":"zanjon","actos":[{"id":"I-iglesia","nombre":"Acto I · Iglesia","dias":"1-3"},{"id":"I-huarpe","nombre":"Acto I · Huarpe","dias":"1-3"},{"id":"II","nombre":"Acto II · Cazado por las dos partes","dias":"4-12"},{"id":"III","nombre":"Acto III · La Labor Vieja y el sello","dias":"13-18"}],"lugares":[{"id":"zanjon","name":"El zanjón partido","tag":"apertura","conn":["camino-villa","totoral-noche"],"npcs":["ignacio","takillpa"],"desc":"Donde terminó Merced. Un solo lugar de arranque para las dos ramas: el texto de apertura lo decide el final que elegiste, y de acá cada una sale hacia su mundo."},{"id":"camino-villa","name":"El camino a la villa","tag":"I-Iglesia","conn":["zanjon","sd-porton"],"npcs":[],"desc":"Una legua de polvo entre acequias. Aquí aparece la comitiva del Santo Oficio."},{"id":"sd-porton","name":"Santo Domingo: la portería","tag":"I-Iglesia","conn":["camino-villa","sd-cripta","sd-archivo","sd-huerta","plaza"],"npcs":["anselmo"],"desc":"Entrada al convento. El prior Anselmo recibe y mira al investigador como quien decide en qué lado de la ley está."},{"id":"sd-cripta","name":"Santo Domingo: la cripta","tag":"I-Iglesia","conn":["sd-porton"],"npcs":["albornoz"],"desc":"Primer interrogatorio. Sobre la mesa, el contenido de los bolsillos del investigador. Tres preguntas, cada mal paso suma sospecha."},{"id":"sd-archivo","name":"Santo Domingo: el archivo","tag":"I-Iglesia","conn":["sd-porton"],"npcs":[],"desc":"Legajos de la fundación de San Juan. Donde se descubre que el Círculo ya había pasado por acá."},{"id":"sd-huerta","name":"Santo Domingo: huerta y ventilación","tag":"I-Iglesia","conn":["sd-porton","camino-villa"],"npcs":[],"desc":"La salida por atrás, y el conducto de ventilación de la cripta: el escape si el encendedor sirve."},{"id":"totoral-noche","name":"El totoral, de noche","tag":"I-Huarpe","conn":["zanjon","altar-sauce","laguna-baja"],"npcs":["takillpa"],"desc":"Barro hasta la rodilla y perros a lo lejos. La persecución activa arranca acá."},{"id":"altar-sauce","name":"El altar del sauce","tag":"I-Huarpe","conn":["totoral-noche","ranchada"],"npcs":["takillpa"],"desc":"Tronco seco con amuleto de hueso y almagre. Acá se aprende el Manto de la Ciénaga, y se decide si se ofrenda un objeto de 1930."},{"id":"laguna-baja","name":"La laguna baja","tag":"I-Huarpe","conn":["totoral-noche","isla-juncos"],"npcs":["ledesma"],"desc":"Por donde cierra la Rastrillería. Escena de persecución con tirada de sigilo o de orientación."},{"id":"ranchada","name":"La ranchada de Guanacache","tag":"I-Huarpe","conn":["altar-sauce","isla-juncos","cueva-pinturas"],"npcs":["takillpa","anciana"],"desc":"El campamento de los guardianes. La anciana no confía en un forastero de metal."},{"id":"isla-juncos","name":"La isla de los juncos","tag":"I-Huarpe","conn":["ranchada","laguna-baja"],"npcs":[],"desc":"Refugio temporal, sin sabuesos. Se puede descansar, pero no por mucho."},{"id":"plaza","name":"La plaza de San Juan","tag":"II · hub","conn":["sd-porton","cabildo","carcel","iglesia-matriz","casa-josefa","pulperia","hacienda-estrada","camino-piedemonte"],"npcs":[],"desc":"El centro de la villa. Todo el Acto II gira acá, con el Santo Oficio vigilando."},{"id":"cabildo","name":"El Cabildo","tag":"II","conn":["plaza"],"npcs":["videla","albornoz"],"desc":"La sala del juicio. La escena central de todo el Acto II, con el medidor de sospecha a la vista."},{"id":"carcel","name":"La cárcel del Cabildo","tag":"II","conn":["plaza"],"npcs":["ledesma"],"desc":"Donde se cae con sospecha 85 o más. Solo se sale por una vía preparada antes."},{"id":"iglesia-matriz","name":"La iglesia matriz","tag":"II","conn":["plaza"],"npcs":["anselmo"],"desc":"Confesarse baja la sospecha, pero deja algo dicho. Puerta lateral: cruce hacia los huarpes."},{"id":"casa-josefa","name":"La casa de Josefa Sosa","tag":"II","conn":["plaza"],"npcs":["josefa"],"desc":"El niño zurdo. De quien depende el linaje que 220 años después llega a Eusebio."},{"id":"pulperia","name":"La pulpería de la villa","tag":"II","conn":["plaza"],"npcs":["mercader"],"desc":"La economía: comprar pólvora, mula, papel; vender lo cargado cuesta. Limosnas que bajan sospecha."},{"id":"hacienda-estrada","name":"La hacienda de Don Gonzalo","tag":"II","conn":["plaza"],"npcs":["gonzalo"],"desc":"Estrada, ahora con el Cabildo detrás. Aliado, cobarde o enemigo, según Acto I."},{"id":"cueva-pinturas","name":"La cueva de las pinturas","tag":"II","conn":["ranchada","camino-piedemonte"],"npcs":["anciana"],"desc":"Arte rupestre huarpe: de acá sale el cálculo de los 234 años. Cruce de ramas: la Iglesia llega por contacto secreto."},{"id":"camino-piedemonte","name":"El camino del piedemonte","tag":"II → III","conn":["plaza","cueva-pinturas","labor-campamento","zanjon-sellado"],"npcs":["arriero"],"desc":"El único camino a la labor y de regreso. Los arrieros saben quién cruza."},{"id":"labor-campamento","name":"La Labor Vieja: el real de cateadores","tag":"III","conn":["camino-piedemonte","labor-bocamina"],"npcs":["capataz"],"desc":"Una docena de hombres del Cabildo con mosquetes acampan al pie de una cantera de cal vieja. Se entra con sigilo, con el reloj como distracción, con el Manto o por la escolta oficial."},{"id":"labor-bocamina","name":"La Labor Vieja: la boca de la labor","tag":"III","conn":["labor-campamento","labor-socavon","labor-ventilacion"],"npcs":[],"desc":"Una boca tapiada por los cateadores con vigas y cadenas. Fuerza, maña o el conducto estrecho."},{"id":"labor-socavon","name":"La Labor Vieja: el socavón de los peones","tag":"III","conn":["labor-bocamina","labor-nucleo"],"npcs":["capataz"],"desc":"Peones indios de mita cavan en galerías angostas. La cercanía al filón torcía la luz: las sombras llegan tres segundos tarde. Posible motín con el cantar."},{"id":"labor-ventilacion","name":"La Labor Vieja: el conducto de ventilación","tag":"III","conn":["labor-bocamina","labor-cripta"],"npcs":[],"desc":"Un tiro de ventilación de los que hacían los antiguos. Paso estrecho: se deja el equipo voluminoso."},{"id":"labor-cripta","name":"La Labor Vieja: la cámara de los antiguos","tag":"III","conn":["labor-ventilacion","labor-nucleo"],"npcs":[],"desc":"Una cámara natural en la caliza. El cuerpo de un investigador de otro bucle, con un objeto de 1930 en la mano. La paradoja: el bucle ya se cerró antes."},{"id":"labor-nucleo","name":"La Labor Vieja: el filón","tag":"III","conn":["labor-socavon","labor-cripta","camino-piedemonte"],"npcs":["albornoz"],"desc":"Donde la caliza se abre y asoma plata nativa, cruzada por calcita. Ahí se decide la salida, y ahí está Albornoz."},{"id":"zanjon-sellado","name":"El zanjón, sellado","tag":"III · final","conn":["camino-piedemonte"],"npcs":["ignacio","takillpa"],"desc":"De vuelta donde empezó. Las tres salidas se ejecutan acá."}],"ocultas":[{"desde":"ranchada","hasta":"iglesia-matriz","cond":"contacto con Fray Anselmo (rama huarpe)"},{"desde":"sd-huerta","hasta":"cueva-pinturas","cond":"contacto con Takillpa (rama Iglesia)"}],"npcs":[{"id":"albornoz","name":"Fray Bartolomé de Albornoz","rol":"Comisario del Santo Oficio y cargo alto del aparato del Círculo","arco":"Te recluta (sospecha ≤ 50 y valor mostrado) o te usa como oráculo (sospecha alta o te negaste). No se pelea de frente.","fuente":"apellido común; no es un comisario real (los reales de Cuyo son de apellido Corbalán o Peláez, y no se usan)"},{"id":"ignacio","name":"Fray Ignacio de la Cruz","rol":"Agente menor del mismo aparato, subordinado de Albornoz","arco":"Obedece (te entrega), te protege o muere. Depende de su actitud y de 3 momentos clave."},{"id":"takillpa","name":"Takillpa","rol":"Guardián huarpe del borde","arco":"Desconfía de tu metal; el altar del sauce decide si le ofrendás algo de 1930."},{"id":"anciana","name":"María Sayanca","rol":"Autoridad de los laguneros y guardiana de las pinturas","arco":"Enseña el Cantar; guarda el cálculo del sello.","fuente":"Sayanca: apellido de caciques huarpes documentado en los archivos laguneros"},{"id":"josefa","name":"Josefa Sosa","rol":"Madre del niño zurdo; el linaje de los Sosa","arco":"Te pide que seas padrino oculto, o que te alejes."},{"id":"gonzalo","name":"Don Gonzalo de Estrada","rol":"Hacendado con mosquete","arco":"Ahora acorralado por el Cabildo: puede ayudar, vender o entregarte."},{"id":"anselmo","name":"Fray Anselmo de Oro","rol":"Prior de Santo Domingo","arco":"Aliado dentro de la Iglesia; abre la puerta lateral para la rama huarpe.","fuente":"Oro: familia sanjuanina; los dominicos tenían convento y viñas en San Juan desde el siglo XVII"},{"id":"ledesma","name":"Sargento Mayor Ledesma","rol":"Jefe de la Rastrillería","arco":"Cazador; se lo puede engañar con el cantar o el reloj.","fuente":"apellido común en Cuyo"},{"id":"videla","name":"Don Blas de Videla","rol":"Alcalde ordinario","arco":"Juez del Cabildo; responde a Albornoz o a su propio miedo.","fuente":"Videla: familia con alcaldes en los cabildos de Cuyo; nombre de pila inventado para no tocar a ninguna persona real"},{"id":"mercader","name":"Gregoria Quiroga, pulpera","rol":"Comercio","arco":"Compra y vende; sabe quién paga limosnas.","fuente":"Quiroga: apellido sanjuanino; la pulpería era oficio de mujeres mestizas"},{"id":"arriero","name":"Ventura Lucero, arriero","rol":"Guía a la Labor Vieja","arco":"Cobra en efectivo o por confianza.","fuente":"Lucero: apellido típico de Cuyo"},{"id":"capataz","name":"Bautista Cárdenas","rol":"Capataz de los cateadores de la Labor Vieja","arco":"Corrompible, temeroso o rebelde según lo que hagas con los peones de mita.","fuente":"apellido común"}],"sospecha":{"escalones":[{"desde":0,"hasta":34,"nombre":"Curioso","efecto":"Te tratan con recelo, sin más."},{"desde":35,"hasta":59,"nombre":"Vigilado","efecto":"Albornoz te interroga en privado; empieza el cerco."},{"desde":60,"hasta":84,"nombre":"Acusado","efecto":"Juicio formal en el Cabildo; puertas que se cierran."},{"desde":85,"hasta":99,"nombre":"Preso","efecto":"Cárcel. Solo se sale por algo preparado antes."},{"desde":100,"hasta":100,"nombre":"Hoguera","efecto":"Desenlace: fin de la aventura."}],"suben":["Usar el encendedor delante de españoles: +15","Que suene el reloj o mostrarlo funcionando: +20","Usar la linterna: +30","Responder con ciencia moderna en el interrogatorio: +15 a +20","Ser visto con Takillpa o entrando a la ranchada: +10 a +25","Huir de una escena o mentir y que lo descubran: +10 a +15","Rama huarpe: usar el encendedor o la linterna ante un mestizo, un prisionero o un informante: sube y además estrecha el cerco."],"bajan":["Confesarse en la iglesia matriz: −10 (deja algo dicho)","Limosna en la pulpería: −5 (cuesta pesos)","Fray Ignacio declara a tu favor: −15 (si te protege)","Fray Anselmo intercede: −10","Pasar un día entero sin incidentes: −5"],"arranque":"Iglesia: 35. Huarpe: 20, pero con persecución activa (la Rastrillería cierra el cerco por días, no por puntos).","escalonesHuarpe":[{"desde":0,"hasta":19,"nombre":"Sin rastro","efecto":"Nadie sabe todavía por dónde andás."},{"desde":20,"hasta":39,"nombre":"Rastro fresco","efecto":"Empieza la persecución: los sabuesos ya tienen el olor."},{"desde":40,"hasta":59,"nombre":"Cerco","efecto":"Se acortan los días del Acto I y se cierran las salidas fáciles de las lagunas."},{"desde":60,"hasta":84,"nombre":"Encima","efecto":"Encuentro forzado con la Rastrillería: fuga o combate, sin elección."},{"desde":85,"hasta":99,"nombre":"Capturado","efecto":"Cárcel del Cabildo; Albornoz ya te tiene."},{"desde":100,"hasta":100,"nombre":"Hoguera","efecto":"Desenlace."}],"nota":"Un solo medidor con dos tablas de consecuencias. La rama Iglesia dispara INTERROGATORIOS al cruzar 35 y 60; la rama huarpe dispara CERCO y FUGAS. Cuando las ramas se cruzan en el Acto II, rige la tabla de la villa."},"ignacio":{"momentos":["M1 · Acto I: enseñarle o esconderle el legajo del Círculo.","M2 · Acto II: Albornoz le exige entregarte; el investigador puede protegerlo, mentirle o abandonarlo.","M3 · Acto III: en Hualilán, Ignacio elige entre obedecer y redimirse."],"estados":[{"id":"obedece","texto":"Te entrega o te vende. Sube la sospecha y cambia la escena del Cabildo."},{"id":"protege","texto":"Testifica a tu favor, baja sospecha, y en Hualilán te cubre la retirada."},{"id":"muere","texto":"Por orden de Albornoz o por tu descuido. Deja un legajo con los nombres del aparato."}]},"albornoz":{"reclutar":"Sospecha ≤ 50 al final del Acto II y haberle mostrado algo del futuro. Te ofrece un lugar; aceptar corrompe (Mitos) y abre el desenlace «se sale con la suya».","usar":"Sospecha > 50 o te negaste. Te lleva a Hualilán como prisionero-oráculo: querés el ingrediente y él quiere lo que sabés del 1944.","final":["muere (solo si se preparó algo antes)","huye","es expuesto ante los suyos","se sale con la suya"]},"finales":[{"id":"salida-1930","title":"Aflojar el sello","condition":"Se llega al zanjón con el sello sin reforzar y con la fecha inferida: el agua se pierde de golpe y el investigador cruza a febrero de 1930."},{"id":"salida-1944","title":"Dejar que reviente","condition":"Se deja que la tensión acumulada llegue sola al 15 de enero de 1944: se cruza en el terremoto. La más peligrosa."},{"id":"quedarse","title":"Reforzar el sello","condition":"Se usa el ingrediente de Hualilán para reforzar el sello y se elige quedarse en 1710. El 1944 histórico queda sin resolver."},{"id":"hoguera","title":"El Auto de Fe","condition":"La sospecha llega a 100. Fin de la aventura, con muerte del investigador."},{"id":"muerte-en-la-mina","title":"Lo que había en la veta","condition":"El investigador cae en Hualilán (Sombra del Socavón o derrumbe) sin haber preparado la salida."}],"consecuencias":[{"clave":"Albornoz: te recluta / te usa / huye / muere / expuesto / se sale con la suya","para":"cualquier aventura futura con el aparato del Círculo"},{"clave":"Ignacio: obedeció / te protegió / murió","para":"escenas con el legajo, y el Círculo local"},{"clave":"El sello: almagre / grabado / reforzado con el ingrediente","para":"1944, y el estado de la Grieta en 1930"},{"clave":"El investigador infirió la fecha del 15 de enero de 1944","para":"la aventura de 1944"},{"clave":"Josefa Sosa: padrino oculto del niño / se alejó","para":"el linaje de los Sosa en 1926-1930"},{"clave":"Hechizos huarpes aprendidos y ofrendas de 1930 entregadas","para":"inventario y hechizos que cruzan"}],"lee":[{"de":"La Merced de las Ánimas","fragmento":"firmó las actas del Cabildo de San Juan como testigo","para":"Apertura Iglesia (sospecha 35, junto a Ignacio)"},{"de":"La Merced de las Ánimas","fragmento":"se alió con Takillpa y los guardianes huarpes","para":"Apertura Huarpe (sospecha 20, con persecución)"}],"salidas":[{"id":"salida-1930","nombre":"1930 · aflojar el sello","descubre":"Es lo que el propio investigador vivió en Zonda: agua contenida durante siglos, perdida de golpe. Lo refuerza una pista del legajo de Ignacio (archivo de Santo Domingo): cuando el agua se suelta de golpe, el borde se abre. Al menos una cadena de pistas alcanzable en cada rama."},{"id":"salida-1944","nombre":"1944 · dejar que reviente","descubre":"Necesita DOS fuentes independientes: (1) las pinturas de la cueva, repintadas por generaciones en cada gran sacudida; (2) el intervalo entre temblores premonitorios, medido con el reloj de pulsera (que también sube la sospecha). El plazo se deduce, nunca se entrega: un éxito de Ocultismo o Geología profundiza el MECANISMO (el sello no elimina la presión, la acumula), jamás el plazo."},{"id":"quedarse","nombre":"Quedarse · reforzar el sello","descubre":"La anciana Sayanca enseña la técnica de grabado; la Labor Vieja da la plata nativa y la calcita para reforzarlo."}],"regla1944":"La fecha del 15 de enero de 1944 se infiere al final del recorrido con al menos dos fuentes. Un fallo en Ocultismo o Geología entrega el dato básico (la piedra tiene fisuras por presión); un éxito entrega el mecanismo (la presión se acumula). Ninguno entrega el plazo. Tratar el terremoto real de San Juan (miles de muertos) con seriedad.","josefa":{"regla":"No se toca la costumbre de «corregir» al zurdo: ya está publicada en 1926 y es del Círculo. El jugador sólo elige cómo se relaciona con el niño.","opciones":["Padrino oculto: le deja una nota o un objeto","Se aleja del niño"],"consecuencia":"Se guarda como consecuencia de campaña. Sólo puede leerla una aventura posterior en la cadena; las de 1926 y 1930 ya publicadas no pueden verla."},"reclutamiento":{"da":["Un salvoconducto del Santo Oficio: la sospecha no pasa de 30 mientras lo lleves","Acceso al archivo del aparato: un documento con la estructura del Círculo (sin nombrar lo sellado)","Pesos en efectivo y una mula de la comitiva","Un hechizo: «Corregir la mano» (ver costo)"],"cuesta":["Mitos +4 (baja el techo de Cordura para siempre): la única pérdida que no se recupera","Un punto de Cordura por cada colaboración, y una fobia o manía nueva al llegar al tercer acto","Consecuencia permanente: el aparato del Círculo lo tiene anotado; futuras aventuras con el aparato lo reconocen y lo tratan como propio o como desertor","Cierra la salida «quedarse» y la de «1930 sin ayuda del aparato»: Albornoz se queda con el ingrediente"],"regla":"Se ofrece sólo con sospecha ≤ 50 y con algo del futuro mostrado. Rechazar no es gratis: pasa a «te usa»."},"items":[{"id":"it-legajo-ignacio","nombre":"El legajo de Fray Ignacio","donde":"sd-archivo / ranchada","uso":"Fechas y nombres de las tres veces que el sello se rompió. Base de las dos fuentes para el 1944.","riesgo":"Sube sospecha si lo ven; pierde valor si Ignacio muere."},{"id":"it-salvoconducto","nombre":"Salvoconducto del Santo Oficio","donde":"sólo si aceptás reclutamiento","uso":"Tope de sospecha 30.","riesgo":"Es prueba de que trabajás para él."},{"id":"it-amuleto-hueso","nombre":"Amuleto de hueso y almagre","donde":"altar-sauce","uso":"Un dado de bonificación en pruebas de sigilo dentro de las lagunas.","riesgo":"Se pierde si se ofrenda un objeto de 1930 y se rechaza."},{"id":"it-polvora-cabildo","nombre":"Pólvora de los barriles del Cabildo","donde":"pulperia / labor-bocamina","uso":"Abrir la boca de la labor a la fuerza, o distraer a los centinelas.","riesgo":"Es delito. Sube sospecha si te ven con ella."},{"id":"it-cera-limosna","nombre":"Limosna para la iglesia","donde":"pulperia (se compra)","uso":"Baja la sospecha en 5 a cambio de pesos.","riesgo":"Se consume."},{"id":"it-plata-nativa","nombre":"Plata nativa y calcita","donde":"labor-nucleo","uso":"El ingrediente que refuerza el sello. Necesario para «quedarse».","riesgo":"Cargado por el Umbral: venderlo o mostrarlo tiene consecuencia."},{"id":"it-objeto-1930-cripta","nombre":"El objeto en la mano del cuerpo","donde":"labor-cripta","uso":"Prueba de que el bucle ya se cerró antes. Pista central del final.","riesgo":"Cordura al reconocerlo."}],"tiradas":[{"escena":"Ocultar el reloj y el encendedor al Comisario (apertura Iglesia)","skill":"sigilo","dif":"regular","falla":"Albornoz los ve: +20 sospecha, pero no es el fin"},{"escena":"Interrogatorio: pregunta 1 (el artefacto)","skill":"persuasion / historia","dif":"regular","falla":"+15 sospecha; sigue"},{"escena":"Interrogatorio: pregunta 2 (cómo sabías la hora)","skill":"psicologia / persuasion","dif":"hard","falla":"+15 y se cae en la línea que lleva a Takillpa"},{"escena":"Escapar por la ventilación con el encendedor","skill":"trepar","dif":"hard","falla":"Te alcanzan; cárcel"},{"escena":"Archivo: leer el legajo en latín","skill":"biblioteca / historia","dif":"regular","falla":"Da lo básico igual"},{"escena":"Persecución en el totoral","skill":"sigilo / orientarse","dif":"regular","falla":"+15 sospecha y el cerco se estrecha"},{"escena":"Aprender el Manto en el altar del sauce","skill":"ocultismo","dif":"hard","falla":"Lo aprende igual con más Cordura perdida (no gatea)"},{"escena":"Juicio del Cabildo","skill":"persuasion / psicologia","dif":"extreme","falla":"Cárcel; hay salida preparada o no"},{"escena":"Motín de los peones","skill":"persuasion (cantar)","dif":"hard","falla":"Combate con los guardias"},{"escena":"Sombra del Socavón: encandilar","skill":"ninguna: sólo el encendedor o la linterna","dif":"auto","falla":"Sin luz, combate imposible"}],"locations":[{"id":"zanjon","name":"El zanjón partido","start":true,"tag":"apertura","conn":["camino-villa","totoral-noche"],"npcs":2,"npcIds":["ignacio","takillpa"],"itemIds":[],"featIds":[],"desc":"Donde terminó Merced. Un solo lugar de arranque para las dos ramas: el texto de apertura lo decide el final que elegiste, y de acá cada una sale hacia su mundo."},{"id":"camino-villa","name":"El camino a la villa","start":false,"tag":"I-Iglesia","conn":["zanjon","sd-porton"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Una legua de polvo entre acequias. Aquí aparece la comitiva del Santo Oficio."},{"id":"sd-porton","name":"Santo Domingo: la portería","start":false,"tag":"I-Iglesia","conn":["camino-villa","sd-cripta","sd-archivo","sd-huerta","plaza"],"npcs":1,"npcIds":["anselmo"],"itemIds":[],"featIds":[],"desc":"Entrada al convento. El prior Anselmo recibe y mira al investigador como quien decide en qué lado de la ley está."},{"id":"sd-cripta","name":"Santo Domingo: la cripta","start":false,"tag":"I-Iglesia","conn":["sd-porton"],"npcs":1,"npcIds":["albornoz"],"itemIds":[],"featIds":[],"desc":"Primer interrogatorio. Sobre la mesa, el contenido de los bolsillos del investigador. Tres preguntas, cada mal paso suma sospecha."},{"id":"sd-archivo","name":"Santo Domingo: el archivo","start":false,"tag":"I-Iglesia","conn":["sd-porton"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Legajos de la fundación de San Juan. Donde se descubre que el Círculo ya había pasado por acá."},{"id":"sd-huerta","name":"Santo Domingo: huerta y ventilación","start":false,"tag":"I-Iglesia","conn":["sd-porton","camino-villa"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"La salida por atrás, y el conducto de ventilación de la cripta: el escape si el encendedor sirve."},{"id":"totoral-noche","name":"El totoral, de noche","start":false,"tag":"I-Huarpe","conn":["zanjon","altar-sauce","laguna-baja"],"npcs":1,"npcIds":["takillpa"],"itemIds":[],"featIds":[],"desc":"Barro hasta la rodilla y perros a lo lejos. La persecución activa arranca acá."},{"id":"altar-sauce","name":"El altar del sauce","start":false,"tag":"I-Huarpe","conn":["totoral-noche","ranchada"],"npcs":1,"npcIds":["takillpa"],"itemIds":[],"featIds":[],"desc":"Tronco seco con amuleto de hueso y almagre. Acá se aprende el Manto de la Ciénaga, y se decide si se ofrenda un objeto de 1930."},{"id":"laguna-baja","name":"La laguna baja","start":false,"tag":"I-Huarpe","conn":["totoral-noche","isla-juncos"],"npcs":1,"npcIds":["ledesma"],"itemIds":[],"featIds":[],"desc":"Por donde cierra la Rastrillería. Escena de persecución con tirada de sigilo o de orientación."},{"id":"ranchada","name":"La ranchada de Guanacache","start":false,"tag":"I-Huarpe","conn":["altar-sauce","isla-juncos","cueva-pinturas"],"npcs":2,"npcIds":["takillpa","anciana"],"itemIds":[],"featIds":[],"desc":"El campamento de los guardianes. La anciana no confía en un forastero de metal."},{"id":"isla-juncos","name":"La isla de los juncos","start":false,"tag":"I-Huarpe","conn":["ranchada","laguna-baja"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Refugio temporal, sin sabuesos. Se puede descansar, pero no por mucho."},{"id":"plaza","name":"La plaza de San Juan","start":false,"tag":"II · hub","conn":["sd-porton","cabildo","carcel","iglesia-matriz","casa-josefa","pulperia","hacienda-estrada","camino-piedemonte"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"El centro de la villa. Todo el Acto II gira acá, con el Santo Oficio vigilando."},{"id":"cabildo","name":"El Cabildo","start":false,"tag":"II","conn":["plaza"],"npcs":2,"npcIds":["videla","albornoz"],"itemIds":[],"featIds":[],"desc":"La sala del juicio. La escena central de todo el Acto II, con el medidor de sospecha a la vista."},{"id":"carcel","name":"La cárcel del Cabildo","start":false,"tag":"II","conn":["plaza"],"npcs":1,"npcIds":["ledesma"],"itemIds":[],"featIds":[],"desc":"Donde se cae con sospecha 85 o más. Solo se sale por una vía preparada antes."},{"id":"iglesia-matriz","name":"La iglesia matriz","start":false,"tag":"II","conn":["plaza"],"npcs":1,"npcIds":["anselmo"],"itemIds":[],"featIds":[],"desc":"Confesarse baja la sospecha, pero deja algo dicho. Puerta lateral: cruce hacia los huarpes."},{"id":"casa-josefa","name":"La casa de Josefa Sosa","start":false,"tag":"II","conn":["plaza"],"npcs":1,"npcIds":["josefa"],"itemIds":[],"featIds":[],"desc":"El niño zurdo. De quien depende el linaje que 220 años después llega a Eusebio."},{"id":"pulperia","name":"La pulpería de la villa","start":false,"tag":"II","conn":["plaza"],"npcs":1,"npcIds":["mercader"],"itemIds":[],"featIds":[],"desc":"La economía: comprar pólvora, mula, papel; vender lo cargado cuesta. Limosnas que bajan sospecha."},{"id":"hacienda-estrada","name":"La hacienda de Don Gonzalo","start":false,"tag":"II","conn":["plaza"],"npcs":1,"npcIds":["gonzalo"],"itemIds":[],"featIds":[],"desc":"Estrada, ahora con el Cabildo detrás. Aliado, cobarde o enemigo, según Acto I."},{"id":"cueva-pinturas","name":"La cueva de las pinturas","start":false,"tag":"II","conn":["ranchada","camino-piedemonte"],"npcs":1,"npcIds":["anciana"],"itemIds":[],"featIds":[],"desc":"Arte rupestre huarpe: de acá sale el cálculo de los 234 años. Cruce de ramas: la Iglesia llega por contacto secreto."},{"id":"camino-piedemonte","name":"El camino del piedemonte","start":false,"tag":"II → III","conn":["plaza","cueva-pinturas","labor-campamento","zanjon-sellado"],"npcs":1,"npcIds":["arriero"],"itemIds":[],"featIds":[],"desc":"El único camino a la labor y de regreso. Los arrieros saben quién cruza."},{"id":"labor-campamento","name":"La Labor Vieja: el real de cateadores","start":false,"tag":"III","conn":["camino-piedemonte","labor-bocamina"],"npcs":1,"npcIds":["capataz"],"itemIds":[],"featIds":[],"desc":"Una docena de hombres del Cabildo con mosquetes acampan al pie de una cantera de cal vieja. Se entra con sigilo, con el reloj como distracción, con el Manto o por la escolta oficial."},{"id":"labor-bocamina","name":"La Labor Vieja: la boca de la labor","start":false,"tag":"III","conn":["labor-campamento","labor-socavon","labor-ventilacion"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Una boca tapiada por los cateadores con vigas y cadenas. Fuerza, maña o el conducto estrecho."},{"id":"labor-socavon","name":"La Labor Vieja: el socavón de los peones","start":false,"tag":"III","conn":["labor-bocamina","labor-nucleo"],"npcs":1,"npcIds":["capataz"],"itemIds":[],"featIds":[],"desc":"Peones indios de mita cavan en galerías angostas. La cercanía al filón torcía la luz: las sombras llegan tres segundos tarde. Posible motín con el cantar."},{"id":"labor-ventilacion","name":"La Labor Vieja: el conducto de ventilación","start":false,"tag":"III","conn":["labor-bocamina","labor-cripta"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Un tiro de ventilación de los que hacían los antiguos. Paso estrecho: se deja el equipo voluminoso."},{"id":"labor-cripta","name":"La Labor Vieja: la cámara de los antiguos","start":false,"tag":"III","conn":["labor-ventilacion","labor-nucleo"],"npcs":0,"npcIds":[],"itemIds":[],"featIds":[],"desc":"Una cámara natural en la caliza. El cuerpo de un investigador de otro bucle, con un objeto de 1930 en la mano. La paradoja: el bucle ya se cerró antes."},{"id":"labor-nucleo","name":"La Labor Vieja: el filón","start":false,"tag":"III","conn":["labor-socavon","labor-cripta","camino-piedemonte"],"npcs":1,"npcIds":["albornoz"],"itemIds":[],"featIds":[],"desc":"Donde la caliza se abre y asoma plata nativa, cruzada por calcita. Ahí se decide la salida, y ahí está Albornoz."},{"id":"zanjon-sellado","name":"El zanjón, sellado","start":false,"tag":"III · final","conn":["camino-piedemonte"],"npcs":2,"npcIds":["ignacio","takillpa"],"itemIds":[],"featIds":[],"desc":"De vuelta donde empezó. Las tres salidas se ejecutan acá."}],"npcNombre":{"albornoz":"Fray Bartolomé de Albornoz","ignacio":"Fray Ignacio de la Cruz","takillpa":"Takillpa","anciana":"María Sayanca","josefa":"Josefa Sosa","gonzalo":"Don Gonzalo de Estrada","anselmo":"Fray Anselmo de Oro","ledesma":"Sargento Mayor Ledesma","videla":"Don Blas de Videla","mercader":"Gregoria Quiroga, pulpera","arriero":"Ventura Lucero, arriero","capataz":"Bautista Cárdenas"}}},"generado":"2026-09-21 21:27"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);
const porId = Object.fromEntries(D.campania.map((c) => [c.id, c]));
const COLOR = { pista: 'var(--pista)', consecuencia: 'var(--cons)', narrado: 'var(--narrado)', desenlace: 'var(--final)' };

let vista = 'campania';   // 'campania' | id de aventura
let sub = 'causa';        // 'mapa' | 'causa' | 'cons'
let sel = null;           // nodo elegido en causa y efecto

$('#generado').textContent = 'Generado desde el código el ' + D.generado + ' · npm run mapa lo regenera';

function nav() {
  const n = $('#nav');
  let h = '<button class="' + (vista === 'campania' ? 'on' : '') + '" data-v="campania">Campaña</button><span class="sep"></span>';
  h += '<select id="sel-av"><option value="">Aventura…</option>' +
    D.campania.map((c) => '<option value="' + c.id + '"' + (vista === c.id ? ' selected' : '') + '>' + esc(c.epoca.split('·')[0].trim() + ' — ' + c.title) + '</option>').join('') + '</select>';
  if (vista !== 'campania' && vista !== '__diseno') {
    h += '<span class="sep"></span>' + [['mapa', 'Lugares'], ['causa', 'Causa y efecto'], ['cons', 'Consecuencias']]
      .map(([k, t]) => '<button class="' + (sub === k ? 'on' : '') + '" data-s="' + k + '">' + t + '</button>').join('');
  }
  n.innerHTML = h;
  n.querySelectorAll('button[data-v]').forEach((b) => (b.onclick = () => ir('campania')));
  n.querySelectorAll('button[data-s]').forEach((b) => (b.onclick = () => { sub = b.dataset.s; sel = null; dibujar(); }));
  $('#sel-av').onchange = (e) => e.target.value && ir(e.target.value);
}
function ir(v) { vista = v; sel = null; dibujar(); window.scrollTo(0, 0); }
function dibujar() { nav(); $('#main').innerHTML = ''; (vista === 'campania' ? campania : vista === '__diseno' ? diseno : aventura)(); }

/* ───────────────────────── CAMPAÑA ───────────────────────── */

function campania() {
  const cs = [...D.campania].sort((a, b) => a.cuando.localeCompare(b.cuando));
  const prof = {};
  const dep = (id, vis = []) => {
    if (prof[id] !== undefined) return prof[id];
    if (vis.includes(id)) return 0;
    const r = (porId[id]?.requiere ?? []).filter((x) => porId[x]);
    return (prof[id] = r.length ? 1 + Math.max(...r.map((x) => dep(x, [...vis, id]))) : 0);
  };
  cs.forEach((c) => dep(c.id));
  const cols = {};
  cs.forEach((c) => (cols[prof[c.id]] = cols[prof[c.id]] || []).push(c));
  const W = 200, H = 84, GX = 70, GY = 34, X0 = 24, Y0 = 120;
  const pos = {};
  Object.keys(cols).forEach((d) => cols[d].forEach((c, i) => (pos[c.id] = { x: X0 + d * (W + GX), y: Y0 + i * (H + GY) })));
  const maxD = Math.max(...Object.keys(cols).map(Number));
  let nodosSvg = '', lineas = '';

  // Requiere (línea continua)
  cs.forEach((c) => c.requiere.filter((r) => pos[r]).forEach((r) => {
    const a = pos[r], b = pos[c.id];
    lineas += '<path d="M' + (a.x + W) + ' ' + (a.y + H / 2) + ' C' + (a.x + W + 34) + ' ' + (a.y + H / 2) + ',' + (b.x - 34) + ' ' + (b.y + H / 2) + ',' + b.x + ' ' + (b.y + H / 2) +
      '" fill="none" stroke="var(--dim)" stroke-width="1.6"/>';
  }));

  // Consecuencias que cruzan (punteada), agrupadas por par
  const par = {};
  D.cruces.forEach((x) => { const k = x.de + '>' + x.a; (par[k] = par[k] || []).push(x); });
  Object.keys(par).forEach((k, i) => {
    const [de, a] = k.split('>');
    if (!pos[de] || !pos[a]) return;
    const A = pos[de], B = pos[a];
    const x1 = A.x + W / 2, y1 = A.y, x2 = B.x + W / 2, y2 = B.y;
    const alto = Math.max(14, Math.min(y1, y2) - 26 - (i % 6) * 12);
    const tip = par[k].length + ' consecuencia(s) de «' + porId[de].title + '» que «' + porId[a].title + '» lee:\n' + par[k].slice(0, 6).map((x) => '· ' + x.frag).join('\n');
    lineas += '<g class="arista"><path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + alto + ',' + x2 + ' ' + alto + ',' + x2 + ' ' + y2 +
      '" fill="none" stroke="var(--cons)" stroke-width="1.6" stroke-dasharray="5 4"><title>' + esc(tip) + '</title></path></g>';
  });

  cs.forEach((c) => {
    const p = pos[c.id];
    nodosSvg += '<g class="nodo" data-id="' + c.id + '" transform="translate(' + p.x + ',' + p.y + ')"><rect width="' + W + '" height="' + H + '" rx="4"/>' +
      '<text x="12" y="22" font-size="13.5">' + esc(trunc(c.title, 27)) + '</text>' +
      '<text class="m" x="12" y="40">' + esc(trunc(c.epoca.split('·')[0].trim(), 34)) + '</text>' +
      '<text class="m" x="12" y="58">' + c.lugares + ' lugares · ' + c.escenas + ' escenas · ' + c.temas + ' temas</text>' +
      '<text class="m" x="12" y="73" style="fill:var(--final)">' + c.finales + ' final' + (c.finales === 1 ? '' : 'es') + (c.continuacion ? '  ·  continuación' : '') + '</text></g>';
  });

  // En diseño: el futuro
  let alto = Y0 + Math.max(...Object.values(cols).map((v) => v.length)) * (H + GY);
  if (D.enDiseno && pos[D.enDiseno.requiere[0]]) {
    const dsn = D.enDiseno, ant = pos[dsn.requiere[0]];
    const gx = ant.x + W + GX, gy = ant.y;
    lineas += '<path d="M' + (ant.x + W) + ' ' + (ant.y + H / 2) + ' L' + gx + ' ' + (gy + H / 2) + '" stroke="var(--dim)" stroke-width="1.6"/>';
    nodosSvg += '<g class="nodo fantasma" data-fant="1" transform="translate(' + gx + ',' + gy + ')"><rect width="' + (W + 30) + '" height="' + (H + 40) + '" rx="4"/>' +
      '<text x="12" y="22" font-size="13.5">' + esc(dsn.title) + '</text>' +
      '<text class="m" x="12" y="40">' + esc(dsn.epoca) + '</text><text class="m" x="12" y="56" style="fill:var(--cons)">' + esc(dsn.estado) + '</text>' +
      dsn.aperturas.map((o, i) => '<text class="m" x="12" y="' + (76 + i * 15) + '">◂ apertura ' + esc(o.nombre) + '</text>').join('') +
      '<text class="m" x="12" y="' + (76 + dsn.aperturas.length * 15 + 2) + '">3 actos: ' + esc(dsn.actos.length) + ' · ~28 lugares</text></g>';
    const sx = gx + W + 30 + GX;
    dsn.salidas.forEach((s, i) => {
      const y = gy - 30 + i * 96;
      lineas += '<path d="M' + (gx + W + 30) + ' ' + (gy + (H + 40) / 2) + ' C' + (gx + W + 60) + ' ' + (gy + (H + 40) / 2) + ',' + (sx - 30) + ' ' + (y + 34) + ',' + sx + ' ' + (y + 34) + '" fill="none" stroke="var(--dim)" stroke-width="1.4" stroke-dasharray="3 4"/>';
      nodosSvg += '<g class="nodo fantasma" transform="translate(' + sx + ',' + y + ')"><rect width="230" height="68" rx="4"/>' +
        '<text x="12" y="22" font-size="12.5">' + esc(trunc(s.nombre, 30)) + '</text>' +
        '<text class="m" x="12" y="40">' + esc(trunc(s.detalle, 40)) + '</text><text class="m" x="12" y="55">' + esc(trunc(s.detalle.slice(40), 40)) + '</text></g>';
    });
    alto = Math.max(alto, gy + 190 + 90);
    var ancho = sx + 260;
  }
  const ancho2 = Math.max(ancho || 0, X0 + (maxD + 1) * (W + GX) + 20);
  $('#main').innerHTML =
    '<div class="leyenda"><span><i style="border-color:var(--dim)"></i>«requiere» — sigue a</span>' +
    '<span><i class="pu" style="border-color:var(--cons)"></i>una consecuencia de la primera que la segunda lee</span>' +
    '<span><i class="pu" style="border-color:var(--dim)"></i>en diseño, todavía sin escribir (clic para ver el esqueleto)</span><span>Clic en una aventura para abrirla</span></div>' +
    '<div class="lienzo"><svg width="' + ancho2 + '" height="' + (alto + 20) + '">' + lineas + nodosSvg + '</svg></div>' + tablaCruces();
  document.querySelectorAll('.nodo[data-id]').forEach((n) => (n.onclick = () => ir(n.dataset.id)));
  document.querySelectorAll('.nodo[data-fant]').forEach((n) => (n.onclick = () => ir('__diseno')));
}

function tablaCruces() {
  if (!D.cruces.length) return '';
  const filas = D.cruces.map((x) => '<tr><td><a class="enlace" onclick="ir(\'' + x.de + '\')">' + esc(porId[x.de].title) + '</a></td>' +
    '<td><a class="enlace" onclick="ir(\'' + x.a + '\')">' + esc(porId[x.a].title) + '</a></td><td><b>' + esc(x.frag) + '</b></td><td>' + x.scope + '</td></tr>').join('');
  return '<div class="caja" style="margin-top:18px"><h2>Ganchos entre aventuras (' + D.cruces.length + ')</h2>' +
    '<p class="nota" style="margin:0 0 8px">Una aventura deja una consecuencia permanente; otra pregunta por un fragmento de su texto. Es la única forma en que lo que hiciste cruza de una a otra.</p>' +
    '<table><tr><th>La deja</th><th>La lee</th><th>Fragmento que se busca</th><th>Alcance</th></tr>' + filas + '</table></div>';
}

/* Lugares: capas por distancia desde el inicio */
function mapa(A) {
  const L = Object.fromEntries(A.locations.map((l) => [l.id, l]));
  const capa = {}; const cola = [];
  const ini = A.locations.find((l) => l.start)?.id;
  if (ini) { capa[ini] = 0; cola.push(ini); }
  while (cola.length) {
    const u = cola.shift();
    const vec = [...(L[u].conn || []), ...A.ocultas.filter((o) => o.desde === u).map((o) => o.hasta)];
    vec.forEach((v) => { if (L[v] && capa[v] === undefined) { capa[v] = capa[u] + 1; cola.push(v); } });
  }
  const sin = A.locations.filter((l) => capa[l.id] === undefined);
  const maxC = Math.max(0, ...Object.values(capa));
  sin.forEach((l) => (capa[l.id] = maxC + 1));
  const cols = {};
  A.locations.forEach((l) => (cols[capa[l.id]] = cols[capa[l.id]] || []).push(l));
  const W = 170, H = 50, GX = 60, GY = 22, P = 20, pos = {};
  Object.keys(cols).forEach((c) => cols[c].forEach((l, i) => (pos[l.id] = { x: P + c * (W + GX), y: P + i * (H + GY) })));
  const filas = Math.max(...Object.values(cols).map((v) => v.length));
  let s = '';
  const flecha = (a, b, oculto, txt) => {
    const p = pos[a], q = pos[b]; if (!p || !q) return '';
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x, y2 = q.y + H / 2;
    const atras = q.x <= p.x;
    const d = atras ? 'M' + (p.x + W / 2) + ' ' + (p.y + H) + ' C' + (p.x + W / 2) + ' ' + (p.y + H + 40) + ',' + (q.x + W / 2) + ' ' + (q.y + H + 40) + ',' + (q.x + W / 2) + ' ' + (q.y + H)
      : 'M' + x1 + ' ' + y1 + ' C' + (x1 + 30) + ' ' + y1 + ',' + (x2 - 30) + ' ' + y2 + ',' + x2 + ' ' + y2;
    return '<path d="' + d + '" fill="none" stroke="' + (oculto ? 'var(--cons)' : 'var(--dim)') + '" stroke-width="1.3"' + (oculto ? ' stroke-dasharray="5 4"' : '') + '><title>' + esc(txt || '') + '</title></path>';
  };
  const hechas = new Set();
  A.locations.forEach((l) => (l.conn || []).forEach((v) => {
    const k = [l.id, v].sort().join('|');
    const rec = (L[v]?.conn || []).includes(l.id);
    if (rec && hechas.has(k)) return; hechas.add(k);
    s += flecha(l.id, v, false, rec ? 'ida y vuelta' : 'sólo de ida');
  }));
  A.ocultas.forEach((o) => (s += flecha(o.desde, o.hasta, true, 'aparece cuando: ' + o.cond)));
  A.locations.forEach((l) => {
    const p = pos[l.id];
    s += '<g class="nodo' + (l.start ? ' sel' : '') + '" transform="translate(' + p.x + ',' + p.y + ')"><rect width="' + W + '" height="' + H + '" rx="4"/>' +
      '<text x="10" y="21" font-size="12.5">' + esc(trunc(l.name, 24)) + '</text><text class="m" x="10" y="38">' + (l.start ? '◆ inicio · ' : '') + (l.tag ? l.tag + ' · ' : '') + l.npcs + ' NPC' + (l.npcs === 1 ? '' : 's') + '</text></g>';
  });
  window.__mapaA = A;
  $('#cuerpo').innerHTML =
    '<div class="leyenda"><span><i style="border-color:var(--dim)"></i>camino</span><span><i class="pu" style="border-color:var(--cons)"></i>conexión oculta (aparece al cumplir una condición)</span><span>◆ lugar de inicio</span></div>' +
    '<div class="lado"><div><div class="lienzo"><svg id="svg-mapa" width="' + (P * 2 + (Object.keys(cols).length) * (W + GX)) + '" height="' + (P * 2 + filas * (H + GY) + 30) + '">' + s + '</svg></div>' +
    (sin.length ? '<p class="nota">Sin camino desde el inicio (a la derecha): ' + sin.map((l) => esc(l.name)).join(', ') + '. Puede ser a propósito si se llega por otro medio.</p>' : '') +
    '<div class="nota">Una flecha por par de lugares; el título dice si es de ida y vuelta o sólo de ida.</div></div>' +
    '<div class="panel" id="panel"><p class="vacio">Tocá un lugar para ver qué se puede hacer ahí y qué deja cada cosa.</p></div></div>';
  document.querySelectorAll('#svg-mapa .nodo').forEach((g) => (g.onclick = () => lugar(g.dataset.id)));
  if (window.__lugarSel) lugar(window.__lugarSel);
}

function lugar(id) {
  const A = window.__mapaA; window.__lugarSel = id;
  const l = A.locations.find((x) => x.id === id);
  document.querySelectorAll('#svg-mapa .nodo').forEach((g) => g.classList.toggle('sel', g.dataset.id === id || (!g.dataset.id && false)));
  const aca = new Set([id, ...l.npcIds, ...l.itemIds, ...l.featIds]);
  const temas = A.nodos.filter((n) => n.kind === 'tema' && l.npcIds.includes(n.npc));
  const escenas = A.nodos.filter((n) => n.kind === 'escena' && n.refs.some((r) => aca.has(r)));
  const fila = (n) => '<li><b style="color:var(--text);font-weight:normal">' + esc(n.label) + '</b>' + (n.sub ? ' <span class="m" style="font:10px var(--mono)">' + esc(n.sub) + '</span>' : '') + '<br>' +
    n.chips.map((c) => '<span class="chip">' + esc(c) + '</span>').join('') +
    (n.pistas.length ? '<span class="chip k-pista">' + n.pistas.length + ' pista' + (n.pistas.length > 1 ? 's' : '') + '</span>' : '') +
    (n.cons.length ? '<span class="chip k-consecuencia">deja ' + n.cons.length + ' consecuencia' + (n.cons.length > 1 ? 's' : '') + '</span>' : '') + '</li>';
  const conex = (l.conn || []).map((v) => (A.locations.find((x) => x.id === v) || {}).name || v);
  const ocul = A.ocultas.filter((o) => o.desde === id).map((o) => ((A.locations.find((x) => x.id === o.hasta) || {}).name || o.hasta) + ' (si: ' + o.cond + ')');
  $('#panel').innerHTML = '<h3>' + esc(l.name) + '</h3><p>' + esc(trunc(l.desc, 220)) + '</p>' +
    '<h4>Salidas</h4><p>' + (conex.length ? esc(conex.join(' · ')) : 'Ninguna declarada.') + (ocul.length ? '<br><span class="k-consecuencia">ocultas:</span> ' + esc(ocul.join(' · ')) : '') + '</p>' +
    '<h4>Hay acá</h4><p>' + (l.npcIds.map((x) => esc(A.npcs[x] || x)).concat(l.itemIds.map((x) => '🎒 ' + esc(A.items[x] || x))).join(' · ') || 'Nada ni nadie.') + '</p>' +
    '<h4>Conversaciones (' + temas.length + ')</h4>' + (temas.length ? '<ul>' + temas.map(fila).join('') + '</ul>' : '<p class="vacio">Ninguna.</p>') +
    '<h4>Escenas ligadas a este lugar (' + escenas.length + ')</h4>' + (escenas.length ? '<ul>' + escenas.map(fila).join('') + '</ul>' : '<p class="vacio">Ninguna atada a un objeto o detalle de acá.</p>') +
    '<p class="nota" style="margin-top:10px">Las escenas que no dependen de un objeto o lugar concreto (p. ej. un desenlace) no aparecen acá: mirá «Causa y efecto».</p>';
}

/* Causa y efecto: quién habilita a quién */
function causa(A) {
  const N = Object.fromEntries(A.nodos.map((n) => [n.id, n]));
  const ar = A.aristas.filter((a) => N[a.de] && N[a.a]);
  const conectados = new Set(); ar.forEach((a) => { conectados.add(a.de); conectados.add(a.a); });
  const nodos = A.nodos.filter((n) => conectados.has(n.id));
  const sueltos = A.nodos.filter((n) => !conectados.has(n.id));
  // Capas: camino más largo desde una fuente, ignorando aristas que cierran un ciclo.
  const ent = {}; ar.forEach((a) => (ent[a.a] = ent[a.a] || []).push(a.de));
  const capa = {}; const en = new Set();
  const cap = (id) => {
    if (capa[id] !== undefined) return capa[id];
    if (en.has(id)) return 0; en.add(id);
    const v = (ent[id] || []).map(cap);
    en.delete(id);
    return (capa[id] = v.length ? 1 + Math.max(...v) : 0);
  };
  nodos.forEach((n) => cap(n.id));
  const cols = {}; nodos.forEach((n) => (cols[capa[n.id]] = cols[capa[n.id]] || []).push(n));
  Object.values(cols).forEach((c) => c.sort((a, b) => (a.kind === b.kind ? a.label.localeCompare(b.label) : a.kind === 'final' ? 1 : -1)));
  const W = 200, H = 52, GX = 70, GY = 16, P = 20, pos = {};
  Object.keys(cols).forEach((c) => cols[c].forEach((n, i) => (pos[n.id] = { x: P + c * (W + GX), y: P + i * (H + GY) })));
  const filas = Math.max(1, ...Object.values(cols).map((v) => v.length));
  const KC = { escena: 'var(--escena)', tema: 'var(--tema)', final: 'var(--final)' };
  const dibujaAr = ar.map((a, i) => {
    const p = pos[a.de], q = pos[a.a];
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x, y2 = q.y + H / 2;
    return '<path class="arista" data-de="' + a.de + '" data-a="' + a.a + '" d="M' + x1 + ' ' + y1 + ' C' + (x1 + 36) + ' ' + y1 + ',' + (x2 - 36) + ' ' + y2 + ',' + x2 + ' ' + y2 +
      '" fill="none" stroke="' + COLOR[a.por] + '" stroke-width="1.5"><title>' + esc(N[a.de].label + ' → ' + N[a.a].label + ' (' + a.por + ')') + '</title></path>';
  }).join('');
  const dibujaNo = nodos.map((n) => {
    const p = pos[n.id];
    return '<g class="nodo" data-id="' + n.id + '" transform="translate(' + p.x + ',' + p.y + ')"><rect width="' + W + '" height="' + H + '" rx="4"/>' +
      '<rect width="4" height="' + H + '" rx="2" style="fill:' + KC[n.kind] + ';stroke:none"/>' +
      '<text x="14" y="21" font-size="12.5">' + esc(trunc(n.label, 27)) + '</text><text class="m" x="14" y="38">' + esc(trunc((n.kind === 'tema' ? '💬 ' : n.kind === 'final' ? '⚑ ' : '') + n.sub, 32)) + '</text></g>';
  }).join('');
  const rows = (l) => l.map((n) => '<tr><td><b>' + esc(n.label) + '</b></td><td>' + n.kind + '</td><td>' + esc(n.sub) + '</td><td>' + n.chips.map((c) => '<span class="chip">' + esc(c) + '</span>').join('') + '</td></tr>').join('');
  $('#cuerpo').innerHTML =
    '<div class="leyenda"><span style="color:var(--escena)">▌escena</span><span style="color:var(--tema)">▌tema de conversación</span><span style="color:var(--final)">▌desenlace</span>' +
    '<span><i style="border-color:var(--pista)"></i>una pista habilita</span><span><i style="border-color:var(--cons)"></i>una consecuencia habilita</span>' +
    '<span><i style="border-color:var(--narrado)"></i>algo ya narrado habilita</span><span><i style="border-color:var(--final)"></i>lleva al desenlace</span><span>Clic en un nodo: ver de dónde viene y adónde lleva</span></div>' +
    '<div class="lado"><div>' +
    (nodos.length ? '<div class="lienzo" style="max-height:74vh"><svg id="svg-causa" width="' + (P * 2 + Object.keys(cols).length * (W + GX)) + '" height="' + (P * 2 + filas * (H + GY)) + '">' + dibujaAr + dibujaNo + '</svg></div>' : '<div class="vacio">Esta aventura no encadena pistas entre escenas: todo se resuelve suelto.</div>') +
    '<details><summary>' + sueltos.length + ' escenas y temas sin cadena (independientes entre sí)</summary><div class="caja"><table><tr><th>Nombre</th><th>Tipo</th><th>Dónde / quién</th><th>Efectos</th></tr>' + rows(sueltos) + '</table></div></details>' +
    '</div><div class="panel" id="panel"><p class="vacio">Elegí un nodo del diagrama.</p></div></div>';
  document.querySelectorAll('#svg-causa .nodo').forEach((g) => (g.onclick = () => elegir(g.dataset.id, A, ar, N)));
  if (sel && N[sel]) elegir(sel, A, ar, N);
}

function elegir(id, A, ar, N) {
  sel = id;
  const arriba = new Set([id]), abajo = new Set([id]);
  const sube = (x) => ar.filter((a) => a.a === x).forEach((a) => { if (!arriba.has(a.de)) { arriba.add(a.de); sube(a.de); } });
  const baja = (x) => ar.filter((a) => a.de === x).forEach((a) => { if (!abajo.has(a.a)) { abajo.add(a.a); baja(a.a); } });
  sube(id); baja(id);
  const vivo = new Set([...arriba, ...abajo]);
  document.querySelectorAll('#svg-causa .nodo').forEach((g) => { g.classList.toggle('tenue', !vivo.has(g.dataset.id)); g.classList.toggle('sel', g.dataset.id === id); });
  document.querySelectorAll('#svg-causa .arista').forEach((p) => p.classList.toggle('tenue', !((arriba.has(p.dataset.de) && arriba.has(p.dataset.a)) || (abajo.has(p.dataset.de) && abajo.has(p.dataset.a)))));
  const n = N[id];
  const antes = ar.filter((a) => a.a === id), despues = ar.filter((a) => a.de === id);
  const li = (l, f) => l.length ? '<ul>' + l.map(f).join('') + '</ul>' : '<p class="vacio">Nada.</p>';
  $('#panel').innerHTML =
    '<h3>' + esc(n.label) + '</h3><p>' + n.kind + (n.sub ? ' · ' + esc(n.sub) : '') + '</p>' + n.chips.map((c) => '<span class="chip">' + esc(c) + '</span>').join('') +
    '<h4>Necesita</h4>' + li(n.req.filter((r) => r.k !== 'otro'), (r) => '<li><span class="k-' + r.k + '">' + r.k + '</span> «' + esc(r.frag) + '»</li>') +
    '<h4>Viene de</h4>' + li(antes, (a) => '<li><span class="k-' + a.por + '">' + a.por + '</span> ← ' + esc(N[a.de].label) + '</li>') +
    '<h4>Deja pistas</h4>' + li(n.pistas, (p) => '<li>' + esc(p) + '</li>') +
    '<h4>Deja consecuencias</h4>' + li(n.cons, (c) => '<li><span class="k-consecuencia">' + c.scope + '</span> ' + esc(c.desc) + '</li>') +
    '<h4>Lleva a</h4>' + li(despues, (a) => '<li><span class="k-' + a.por + '">' + a.por + '</span> → ' + esc(N[a.a].label) + '</li>');
}

/* Consecuencias */
function consecuencias(c, A) {
  const deja = A.nodos.flatMap((n) => n.cons.map((x) => ({ n, x })));
  const recibe = D.cruces.filter((x) => x.a === c.id);
  const leen = D.cruces.filter((x) => x.de === c.id);
  const t1 = deja.length ? '<table><tr><th>Dónde</th><th>Alcance</th><th>Queda escrito</th></tr>' +
    deja.map(({ n, x }) => '<tr><td><b>' + esc(n.label) + '</b><br><span class="chip">' + n.kind + '</span></td><td>' + x.scope + (x.scope === 'campaign' || x.scope === 'world' ? '<br><span class="chip">cruza de aventura</span>' : '') + '</td><td>' + esc(x.desc) + '</td></tr>').join('') + '</table>'
    : '<p class="vacio">No deja consecuencias permanentes.</p>';
  const t2 = recibe.length ? '<table><tr><th>De qué aventura</th><th>Quién lo pregunta acá</th><th>Fragmento</th></tr>' +
    recibe.map((x) => '<tr><td><a class="enlace" onclick="ir(\'' + x.de + '\')">' + esc(porId[x.de].title) + '</a></td><td>' + esc(x.hasta.slice(2)) + '</td><td><b>' + esc(x.frag) + '</b></td></tr>').join('') + '</table>'
    : '<p class="vacio">No lee nada de otras aventuras.</p>';
  const t3 = leen.length ? '<table><tr><th>Quién la lee</th><th>Dónde</th><th>Fragmento</th></tr>' +
    leen.map((x) => '<tr><td><a class="enlace" onclick="ir(\'' + x.a + '\')">' + esc(porId[x.a].title) + '</a></td><td>' + esc(x.hasta.slice(2)) + '</td><td><b>' + esc(x.frag) + '</b></td></tr>').join('') + '</table>'
    : '<p class="vacio">Ninguna otra aventura lee lo que ésta deja.</p>';
  const fin = A.finales.map((f) => '<tr><td><b>' + esc(f.title) + '</b></td><td>' + esc(f.condition) + '</td></tr>').join('');
  $('#cuerpo').innerHTML =
    '<div class="caja"><h2>Desenlaces (' + A.finales.length + ')</h2><table><tr><th>Título</th><th>Cuándo se llega</th></tr>' + fin + '</table></div>' +
    '<div class="caja"><h2>Lo que deja escrito</h2>' + t1 + '</div>' +
    '<div class="caja"><h2>Lo que recibe de aventuras anteriores</h2>' + t2 + '</div>' +
    '<div class="caja"><h2>Quién más lee lo que deja</h2>' + t3 + '</div>' +
    '<p class="nota">Las consecuencias con alcance «scene» mueren al terminar la escena; «campaign» y «world» son las únicas que pueden cruzar a otra aventura.</p>';
}

dibujar();
</script>
</body>
</html>
